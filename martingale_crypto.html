<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Martingale Calculator</title>

<style>
body{
    font-family:Arial;
    background:#f4f6f9;
    margin:30px;
}

h2{
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:10px;
    font-size:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#1976d2;
    color:white;
    padding:10px;
    font-size:14px;
}

td{
    padding:8px;
    border-bottom:1px solid #ddd;
    text-align:right;
}

tr:hover{
    background:#f8f8f8;
}

.summary{
    display:flex;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.box{
    flex:1;
    min-width:220px;
    background:white;
    border-radius:8px;
    padding:15px;
    box-shadow:0 2px 5px rgba(0,0,0,.08);
}

.box h3{
    margin:0;
    color:#666;
    font-size:14px;
}

.box h1{
    margin:10px 0 0;
    font-size:26px;
    color:#1976d2;
}
</style>
</head>

<body>

<h2>Martingale Calculator</h2>

<div class="card">

<div class="grid">

<div>
<label>Harga Pasar Awal (Rp)</label>
<input id="harga" type="number" value="1000">
</div>

<div>
<label>Pembelian Awal (Rp)</label>
<input id="modal" type="number" value="25000">
</div>

<div>
<label>Strategi Martingale (x)</label>
<input id="martingale" type="number" step="0.1" value="2">
</div>

<div>
<label>Penurunan tiap Level (%)</label>
<input id="turun" type="number" step="0.1" value="1">
</div>

<div>
<label>Jumlah Level</label>
<input id="level" type="number" value="10">
</div>

</div>

</div>

<div class="summary">

<div class="box">
<h3>Total Modal</h3>
<h1 id="totalModal">Rp0</h1>
</div>

<div class="box">
<h3>Total Unit</h3>
<h1 id="totalUnit">0</h1>
</div>

<div class="box">
<h3>Average Buy</h3>
<h1 id="avgBuy">0</h1>
</div>

</div>

<table>

<thead>

<tr>
<th>Level</th>
<th>Harga Pasar</th>
<th>Pembelian</th>
<th>Unit Didapat</th>
<th>Total Unit</th>
<th>Total Modal</th>
<th>Avg Buy</th>
<th>Naik ke BEP</th>
</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

<script>

const ids=["harga","modal","martingale","turun","level"];

ids.forEach(i=>{
    document.getElementById(i).addEventListener("input",hitung);
});

function rupiah(x){
    return Number(x).toLocaleString("id-ID",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function angka(x){
    return Number(x).toLocaleString("id-ID",{
        minimumFractionDigits:4,
        maximumFractionDigits:4
    });
}

function hitung(){

let hargaAwal=parseFloat(harga.value);
let modalAwal=parseFloat(modal.value);
let m=parseFloat(martingale.value);
let turunPersen=parseFloat(turun.value)/100;
let lvl=parseInt(level.value);

let hargaSekarang=hargaAwal;
let beli=modalAwal;

let totalModal=0;
let totalUnit=0;

tbody.innerHTML="";

for(let i=1;i<=lvl;i++){

    if(i>1){
        hargaSekarang*=1-turunPersen;
        beli*=m;
    }

    let unit=beli/hargaSekarang;

    totalModal+=beli;
    totalUnit+=unit;

    let avg=totalModal/totalUnit;

    let need=((avg-hargaSekarang)/hargaSekarang)*100;

    tbody.innerHTML+=`
    <tr>
        <td>${i}</td>
        <td>${rupiah(hargaSekarang)}</td>
        <td>${rupiah(beli)}</td>
        <td>${angka(unit)}</td>
        <td>${angka(totalUnit)}</td>
        <td>${rupiah(totalModal)}</td>
        <td>${rupiah(avg)}</td>
        <td>${need.toFixed(2)} %</td>
    </tr>
    `;
}

document.getElementById("totalModal").innerHTML="Rp "+rupiah(totalModal);
document.getElementById("totalUnit").innerHTML=angka(totalUnit);
document.getElementById("avgBuy").innerHTML=rupiah(totalModal/totalUnit);

}

hitung();

</script>

</body>
</html>
