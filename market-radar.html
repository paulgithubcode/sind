<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Radar</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #1a1a1a;
      --card-hover: #222;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --text-dim: #888;
      --green: #00c853;
      --red: #ff5252;
      --blue: #42a5f5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .status {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
    }
    .status .dot.error { background: var(--red); }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .tab.active {
      background: #1e3a5f;
      border-color: var(--blue);
      color: var(--text);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    button, input[type="date"], input[type="text"], select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      color-scheme: dark;
    }
    button { cursor: pointer; }
    button:hover { background: var(--card-hover); }
    input[type="text"] { flex: 1; min-width: 100px; }
    input[type="date"] { min-width: 140px; }
    .section-title {
      font-size: 14px;
      color: var(--text-dim);
      margin: 16px 0 10px;
    }
    /* Timeline */
    .timeline { position: relative; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 52px; top: 8px; bottom: 8px;
      width: 2px; background: var(--border);
    }
    .item { display: flex; gap: 12px; margin-bottom: 10px; }
    .time {
      width: 48px; font-size: 12px; color: var(--text-dim);
      text-align: right; padding-top: 14px; flex-shrink: 0;
    }
    .dot-line {
      width: 12px; display: flex; justify-content: center;
      padding-top: 16px; z-index: 1;
    }
    .dot-line span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; border: 2px solid var(--bg);
    }
    .card {
      flex: 1; background: var(--card); border-radius: 12px;
      padding: 12px 14px; display: flex; gap: 12px;
      border: 1px solid var(--border);
    }
    .card.buy .logo-wrap { box-shadow: 0 0 0 2px var(--green); }
    .card.sell .logo-wrap { box-shadow: 0 0 0 2px var(--red); }
    .logo-wrap {
      width: 40px; height: 40px; border-radius: 50%;
      overflow: hidden; background: #2a2a2a;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .logo-fallback { font-size: 11px; font-weight: 700; color: #aaa; }
    .info { flex: 1; min-width: 0; }
    .row1 { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .sec-code { font-size: 14px; font-weight: 600; }
    .signal-name { font-size: 13px; font-weight: 500; }
    .signal-name.up { color: var(--green); }
    .signal-name.down { color: var(--red); }
    .row2 {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; color: var(--text-dim);
    }
    .price { font-weight: 500; color: var(--text); }
    .pct.up { color: var(--green); }
    .pct.down { color: var(--red); }
    .meta { margin-left: auto; white-space: nowrap; }
    /* Stats */
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    .stat-card:hover { border-color: #3a3a3a; }
    .stat-card h3 {
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      gap: 10px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-count {
      background: #1e3a5f;
      color: var(--blue);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .loading, .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }
    .sub-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .sub-tab {
      padding: 7px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
    }
    .sub-tab.active {
      background: #1e3a5f;
      border-color: var(--blue);
      color: var(--text);
    }
    .stats-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .stats-toolbar input { flex: 1; min-width: 140px; }
    .stats-toolbar select { min-width: 130px; }
    .signal-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .signal-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .signal-dot.up { background: var(--green); }
    .signal-dot.down { background: var(--red); }
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      color: var(--text);
      transition: background 0.12s;
    }
    .chip:hover { background: #2e2e2e; }
    .chip b { font-weight: 600; letter-spacing: 0.3px; }
    .chip .cnt { color: var(--blue); font-weight: 600; font-size: 11px; }
    .chip .dates { color: var(--text-dim); font-size: 10px; }
    .expand-btn {
      margin-top: 10px;
      background: transparent;
      border: 1px dashed #444;
      color: var(--text-dim);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
    }
    .expand-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }
    .summary-card {
      background: linear-gradient(135deg, #1a2332 0%, #1a1a1a 100%);
      border: 1px solid #2a3a4a;
    }
    .summary-card h3 { color: var(--blue); }
    /* ===== MATRIX SIGNAL ===== */
    .matrix-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .matrix-controls select { flex: 1; min-width: 180px; }
    .matrix-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      max-height: 70vh;
      overflow-y: auto;
    }
    .matrix-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .matrix-table th, .matrix-table td {
      padding: 8px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      min-width: 42px;
    }
    .matrix-table th {
      background: #151515;
      color: var(--text-dim);
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .matrix-table th:first-child,
    .matrix-table td:first-child {
      text-align: left;
      padding-left: 12px;
      padding-right: 12px;
      position: sticky;
      left: 0;
      background: var(--card);
      z-index: 1;
      font-weight: 600;
      min-width: 72px;
    }
    .matrix-table th:first-child {
      background: #151515;
      z-index: 3;
    }
    .matrix-table tr:hover td { background: #222; }
    .matrix-table tr:hover td:first-child { background: #222; }
    .check { color: var(--green); font-weight: 700; font-size: 14px; }
    .no-check { color: #333; }
    .matrix-info {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .matrix-info .signal-label { color: var(--text); font-weight: 500; }
    #statsNormalControls, #statsMatrixControls { display: none; }
    #statsNormalControls.show, #statsMatrixControls.show { display: block; }

    /* ===== RECOMMEND ===== */
    .rec-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      margin-bottom: 16px;
    }
    .rec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 480px;
    }
    .rec-table th, .rec-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .rec-table th {
      background: #151515;
      color: var(--text-dim);
      font-weight: 500;
      position: sticky;
      top: 0;
    }
    .rec-table tr:hover td { background: #222; }
    .rec-table .code { font-weight: 600; color: var(--text); }
    .rec-table .score { color: var(--blue); font-weight: 600; }
    .rec-table .ratio-good { color: var(--green); }
    .rec-table .ratio-mid { color: #ffb74d; }
    .rec-table .ratio-bad { color: var(--red); }
    .rec-section { margin-bottom: 20px; }
    .rec-section h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: var(--blue);
    }
    .rec-conclusion {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }
    .rec-conclusion ul { margin: 8px 0 0 18px; }
    .rec-conclusion li { margin-bottom: 6px; }
    .rec-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .rec-badge.hot { background: #1b3a1b; color: var(--green); }
    .rec-badge.ok { background: #3a2e1b; color: #ffb74d; }
    .rec-badge.weak { background: #3a1b1b; color: var(--red); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Market Radar</h1>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('timeline', this)">Timeline</div>
      <div class="tab" onclick="switchTab('stats', this)">Statistik</div>
      <div class="tab" onclick="switchTab('recommend', this)">Recommend</div>
    </div>

    <!-- ===================== TAB TIMELINE ===================== -->
    <div id="panel-timeline" class="panel active">
      <div class="controls">
        <input type="date" id="datePicker" />
        <button onclick="loadTimeline()">Tampilkan</button>
      </div>
      <div class="controls">
        <input type="text" id="searchInput" placeholder="Cari kode saham..." />
        <select id="signalFilter">
          <option value="">Semua Signal</option>
          <option value="1">Huge Buy (Lot)</option>
          <option value="2">Huge Sell (Lot)</option>
          <option value="3">Intensive Buy</option>
          <option value="4">Intensive Sell</option>
          <option value="5">Rapid Buy (IDR)</option>
          <option value="6">Rapid Sell (IDR)</option>
          <option value="7">Large Best Bid</option>
          <option value="8">Large Best Offer</option>
          <option value="9">Nego Spike</option>
          <option value="10">Nego Active</option>
          <option value="11">Breakout High</option>
          <option value="12">Breakout Low</option>
          <option value="13">Quick Rebound</option>
          <option value="14">Quick Reject</option>
        </select>
      </div>
      <div class="section-title">
        <span id="dateLabel">-</span>
        <span id="countBadge" style="color:#666"></span>
      </div>
      <div class="timeline" id="timeline">
        <div class="loading">Pilih tanggal lalu klik Tampilkan</div>
      </div>
    </div>

    <!-- ===================== TAB STATISTIK ===================== -->
    <div id="panel-stats" class="panel">
      <div class="sub-tabs">
        <div class="sub-tab active" onclick="switchStatsView('signal', this)">Per Signal</div>
        <div class="sub-tab" onclick="switchStatsView('stock', this)">Per Saham</div>
        <div class="sub-tab" onclick="switchStatsView('matrix', this)">Matrix Signal</div>
      </div>
      <div id="statsNormalControls" class="show">
        <div class="controls">
          <input type="date" id="statsFrom" />
          <span style="color:#666">s/d</span>
          <input type="date" id="statsTo" />
          <button onclick="loadStats()">Hitung</button>
        </div>
        <div class="stats-toolbar" id="statsToolbar" style="display:none">
          <input type="text" id="statsSearch" placeholder="Cari kode / nama signal..." />
          <select id="statsSort">
            <option value="count-desc">Terbanyak</option>
            <option value="count-asc">Tersedikit</option>
            <option value="name-asc">A → Z</option>
          </select>
        </div>
      </div>
      <div id="statsMatrixControls">
        <div class="matrix-controls">
          <select id="matrixSignal">
            <option value="">-- Pilih Signal --</option>
            <option value="1">Huge Buy (Lot)</option>
            <option value="2">Huge Sell (Lot)</option>
            <option value="3">Intensive Buy</option>
            <option value="4">Intensive Sell</option>
            <option value="5">Rapid Buy (IDR)</option>
            <option value="6">Rapid Sell (IDR)</option>
            <option value="7">Large Best Bid</option>
            <option value="8">Large Best Offer</option>
            <option value="9">Nego Spike</option>
            <option value="10">Nego Active</option>
            <option value="11">Breakout High</option>
            <option value="12">Breakout Low</option>
            <option value="13">Quick Rebound</option>
            <option value="14">Quick Reject</option>
          </select>
          <button onclick="loadMatrix()">Tampilkan</button>
          <button onclick="downloadMatrixJSON()" id="btnDownloadMatrix" style="display:none">Download JSON</button>
        </div>
        <div id="matrixInfo" class="matrix-info" style="display:none"></div>
      </div>
      <div id="statsResult">
        <div class="empty">Pilih rentang tanggal lalu klik Hitung</div>
      </div>
    </div>

    <!-- ===================== TAB RECOMMEND ===================== -->
    <div id="panel-recommend" class="panel">
      <div class="sub-tabs">
        <div class="sub-tab active" onclick="switchRecMode('matrix', this)">Matrix Style</div>
        <div class="sub-tab" onclick="switchRecMode('raw', this)">Raw Data</div>
      </div>
      <div class="controls">
        <input type="date" id="recFrom" />
        <span style="color:#666">s/d</span>
        <input type="date" id="recTo" />
        <button onclick="loadRecommend()">Hitung</button>
      </div>
      <div id="recResult">
        <div class="empty">Pilih rentang tanggal lalu klik Hitung</div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = "https://raw.githubusercontent.com/paulgithubcode/sind/main/market_radar_by_day/";
    const SIGNAL_MAP = {
      1:  { name: "Huge Buy (Lot)",        dir: "up" },
      2:  { name: "Huge Sell (Lot)",       dir: "down" },
      3:  { name: "Intensive Buy",         dir: "up" },
      4:  { name: "Intensive Sell",        dir: "down" },
      5:  { name: "Rapid Buy (IDR)",       dir: "up" },
      6:  { name: "Rapid Sell (IDR)",      dir: "down" },
      7:  { name: "Large Best Bid (Lot)",  dir: "up" },
      8:  { name: "Large Best Offer (Lot)",dir: "down" },
      9:  { name: "Nego Spike (IDR)",      dir: "up" },
      10: { name: "Nego Active (IDR)",     dir: "up" },
      11: { name: "Breakout High",         dir: "up" },
      12: { name: "Breakout Low",          dir: "down" },
      13: { name: "Quick Rebound",         dir: "up" },
      14: { name: "Quick Reject",          dir: "down" }
    };

    const BULLISH_WEIGHT = {
      1: 3, 3: 2, 5: 2, 7: 2, 9: 1.5, 10: 1, 11: 3, 13: 1.5
    };
    const BEARISH_SIGNALS = new Set([2, 4, 6, 8, 12, 14]);

    let historyList = [];
    let currentSearch = "";
    let currentSignal = "";
    let statsCache = null;
    let statsView = "signal";
    let statsExpanded = {};
    let matrixData = null;
    let recMode = "matrix"; // "matrix" | "raw"

    function getLocalDateString(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }
    const today = getLocalDateString();
    document.getElementById("datePicker").value = today;
    document.getElementById("statsFrom").value = today;
    document.getElementById("statsTo").value = today;
    document.getElementById("recFrom").value = today;
    document.getElementById("recTo").value = today;

    function formatTime(iso) {
      try { return iso.split("T")[1].split("+")[0].substring(0, 8); }
      catch { return iso; }
    }
    function formatValue(val) {
      if (val == null) return "-";
      const n = Number(val);
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
      return n.toLocaleString("id-ID");
    }
    function getSignalName(sig) {
      return SIGNAL_MAP[sig]?.name || `Signal ${sig}`;
    }
    function isUp(item) {
      return SIGNAL_MAP[item.signal]?.dir === "up";
    }
    function getSignalDir(sig) {
      return SIGNAL_MAP[sig]?.dir || "up";
    }
    function getDatesInRange(from, to) {
      const dates = [];
      let current = new Date(from + "T00:00:00");
      const end = new Date(to + "T00:00:00");
      while (current <= end) {
        dates.push(getLocalDateString(current));
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }
    function getLastNWeekdays(n) {
      const dates = [];
      const d = new Date();
      while (dates.length < n) {
        const day = d.getDay();
        if (day !== 0 && day !== 6) dates.push(getLocalDateString(d));
        d.setDate(d.getDate() - 1);
      }
      return dates;
    }
    async function fetchDay(date) {
      try {
        const res = await fetch(`${BASE_URL}radar_${date}.json?t=${Date.now()}`);
        if (!res.ok) return [];
        let data = await res.json();
        if (!Array.isArray(data)) data = data.list || [];
        return data;
      } catch { return []; }
    }

    function switchTab(name, el) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("panel-" + name).classList.add("active");
    }
    function switchStatsView(view, el) {
      document.querySelectorAll("#panel-stats .sub-tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      statsView = view;
      statsExpanded = {};
      const normal = document.getElementById("statsNormalControls");
      const matrix = document.getElementById("statsMatrixControls");
      const result = document.getElementById("statsResult");
      if (view === "matrix") {
        normal.classList.remove("show");
        matrix.classList.add("show");
        if (!result.querySelector(".matrix-wrap")) {
          result.innerHTML = `<div class="empty">Pilih signal lalu klik Tampilkan</div>`;
        }
      } else {
        matrix.classList.remove("show");
        normal.classList.add("show");
        if (statsCache) renderStats();
        else result.innerHTML = `<div class="empty">Pilih rentang tanggal lalu klik Hitung</div>`;
      }
    }
    function switchRecMode(mode, el) {
      document.querySelectorAll("#panel-recommend .sub-tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      recMode = mode;
      document.getElementById("recResult").innerHTML = `<div class="empty">Pilih rentang tanggal lalu klik Hitung</div>`;
    }

    // ===================== TIMELINE =====================
    function filterList(list) {
      return list.filter(item => {
        if (currentSearch && !(item.secCode || "").toLowerCase().includes(currentSearch.toLowerCase())) return false;
        if (currentSignal && String(item.signal) !== currentSignal) return false;
        return true;
      });
    }
    function renderTimeline(list) {
      const el = document.getElementById("timeline");
      const filtered = filterList(list);
      const badge = document.getElementById("countBadge");
      badge.textContent = filtered.length !== list.length
        ? `(${filtered.length} / ${list.length})`
        : list.length ? `(${list.length})` : "";
      if (!filtered.length) {
        el.innerHTML = `<div class="empty">Tidak ada data</div>`;
        return;
      }
      el.innerHTML = filtered.map(item => {
        const up = isUp(item);
        const pct = item.changePercentage || "0%";
        const pctClass = pct.startsWith("-") ? "down" : "up";
        return `
          <div class="item">
            <div class="time">${formatTime(item.timestamp)}</div>
            <div class="dot-line"><span></span></div>
            <div class="card ${up ? "buy" : "sell"}">
              <div class="logo-wrap">
                <img src="${item.logo || ''}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
                <div class="logo-fallback" style="display:none">${(item.secCode||'--').slice(0,2)}</div>
              </div>
              <div class="info">
                <div class="row1">
                  <span class="sec-code">${item.secCode || '-'}</span>
                  <span class="signal-name ${up ? 'up' : 'down'}">${getSignalName(item.signal)} ${up ? '↑' : '↓'}</span>
                </div>
                <div class="row2">
                  <span class="price">${item.lastPrice || '-'}</span>
                  <span class="pct ${pctClass}">${pct}</span>
                  <span class="meta">${formatValue(item.value)}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }
    async function loadTimeline() {
      const date = document.getElementById("datePicker").value;
      if (!date) return alert("Pilih tanggal");
      document.getElementById("statusText").textContent = "Loading...";
      document.getElementById("timeline").innerHTML = `<div class="loading">Mengambil data...</div>`;
      document.getElementById("dateLabel").textContent = date;
      const data = await fetchDay(date);
      const seen = {};
      historyList = data.filter(i => {
        if (!i.id || seen[i.id]) return false;
        seen[i.id] = true;
        return true;
      }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      renderTimeline(historyList);
      document.getElementById("statusText").textContent = `Total ${historyList.length}`;
    }
    document.getElementById("searchInput").addEventListener("input", e => {
      currentSearch = e.target.value;
      renderTimeline(historyList);
    });
    document.getElementById("signalFilter").addEventListener("change", e => {
      currentSignal = e.target.value;
      renderTimeline(historyList);
    });

    // ===================== STATISTIK =====================
    async function loadStats() {
      const from = document.getElementById("statsFrom").value;
      const to   = document.getElementById("statsTo").value;
      if (!from || !to) return alert("Pilih rentang tanggal");
      if (from > to) return alert("Tanggal 'dari' tidak boleh lebih besar dari 'sampai'");
      const el = document.getElementById("statsResult");
      el.innerHTML = `<div class="loading">Mengambil data ${from} s/d ${to}...</div>`;
      document.getElementById("statusText").textContent = "Loading stats...";
      document.getElementById("statsToolbar").style.display = "none";
      const dates = getDatesInRange(from, to);
      const allData = [];
      for (const d of dates) {
        const data = await fetchDay(d);
        data.forEach(item => { item._date = d; allData.push(item); });
      }
      const bySignal = {};
      allData.forEach(item => {
        const sig = item.signal;
        const code = item.secCode || "UNKNOWN";
        if (!bySignal[sig]) bySignal[sig] = { total: 0, stocks: {} };
        bySignal[sig].total++;
        if (!bySignal[sig].stocks[code]) bySignal[sig].stocks[code] = { count: 0, dates: new Set() };
        bySignal[sig].stocks[code].count++;
        bySignal[sig].stocks[code].dates.add(item._date);
      });
      const byStock = {};
      allData.forEach(item => {
        const code = item.secCode || "UNKNOWN";
        const sig = item.signal;
        if (!byStock[code]) byStock[code] = { total: 0, signals: {} };
        byStock[code].total++;
        if (!byStock[code].signals[sig]) byStock[code].signals[sig] = { count: 0, dates: new Set() };
        byStock[code].signals[sig].count++;
        byStock[code].signals[sig].dates.add(item._date);
      });
      statsCache = { bySignal, byStock, total: allData.length, from, to };
      statsExpanded = {};
      renderStats();
      document.getElementById("statusText").textContent = `Stats: ${allData.length} data`;
    }
    function renderStats() {
      if (!statsCache || statsView === "matrix") return;
      const el = document.getElementById("statsResult");
      const toolbar = document.getElementById("statsToolbar");
      toolbar.style.display = "flex";
      const { bySignal, byStock, total, from, to } = statsCache;
      const search = (document.getElementById("statsSearch")?.value || "").toLowerCase();
      const sortMode = document.getElementById("statsSort")?.value || "count-desc";
      let html = `
        <div class="stat-card summary-card">
          <h3><span>Ringkasan ${from} s/d ${to}</span>
          <span class="stat-count">${total.toLocaleString("id-ID")}</span></h3>
          <div class="stat-row" style="border:none;padding:0">
            <span style="color:var(--text-dim);font-size:13px">Total sinyal</span>
          </div>
        </div>`;
      if (statsView === "signal") {
        let entries = Object.entries(bySignal);
        if (search) {
          entries = entries.filter(([sig, info]) => {
            const name = getSignalName(sig).toLowerCase();
            const hasStock = Object.keys(info.stocks).some(c => c.toLowerCase().includes(search));
            return name.includes(search) || hasStock;
          });
        }
        entries.sort((a, b) => {
          if (sortMode === "count-desc") return b[1].total - a[1].total;
          if (sortMode === "count-asc") return a[1].total - b[1].total;
          return getSignalName(a[0]).localeCompare(getSignalName(b[0]));
        });
        entries.forEach(([sig, info]) => {
          const dir = getSignalDir(sig);
          const stocks = Object.entries(info.stocks).sort((a, b) => b[1].count - a[1].count);
          const isExpanded = statsExpanded[`sig-${sig}`];
          const limit = 8;
          const show = isExpanded ? stocks : stocks.slice(0, limit);
          const hasMore = stocks.length > limit;
          const chips = show.map(([code, s]) => `
            <div class="chip" title="${[...s.dates].sort().join(", ")}">
              <b>${code}</b><span class="cnt">${s.count}×</span>
              ${s.dates.size > 1 ? `<span class="dates">${s.dates.size} hari</span>` : ""}
            </div>`).join("");
          html += `
            <div class="stat-card">
              <h3>
                <div class="signal-title"><span class="signal-dot ${dir}"></span><span>${getSignalName(sig)}</span></div>
                <span class="stat-count">${info.total.toLocaleString("id-ID")}</span>
              </h3>
              <div class="chip-list">${chips}</div>
              ${hasMore ? `<button class="expand-btn" onclick="toggleExpand('sig-${sig}')">${isExpanded ? "Tampilkan lebih sedikit" : `Tampilkan ${stocks.length - limit} lainnya`}</button>` : ""}
            </div>`;
        });
      } else {
        let entries = Object.entries(byStock);
        if (search) entries = entries.filter(([code]) => code.toLowerCase().includes(search));
        entries.sort((a, b) => {
          if (sortMode === "count-desc") return b[1].total - a[1].total;
          if (sortMode === "count-asc") return a[1].total - b[1].total;
          return a[0].localeCompare(b[0]);
        });
        entries.forEach(([code, info]) => {
          const signals = Object.entries(info.signals).sort((a, b) => b[1].count - a[1].count);
          const isExpanded = statsExpanded[`stk-${code}`];
          const limit = 6;
          const show = isExpanded ? signals : signals.slice(0, limit);
          const hasMore = signals.length > limit;
          const chips = show.map(([sig, s]) => `
            <div class="chip" title="${[...s.dates].sort().join(", ")}">
              <span class="signal-dot ${getSignalDir(sig)}" style="width:6px;height:6px"></span>
              <b style="font-weight:500">${getSignalName(sig)}</b>
              <span class="cnt">${s.count}×</span>
            </div>`).join("");
          html += `
            <div class="stat-card">
              <h3><span style="font-weight:600;letter-spacing:0.4px">${code}</span>
              <span class="stat-count">${info.total.toLocaleString("id-ID")}</span></h3>
              <div class="chip-list">${chips}</div>
              ${hasMore ? `<button class="expand-btn" onclick="toggleExpand('stk-${code}')">${isExpanded ? "Tampilkan lebih sedikit" : `Tampilkan ${signals.length - limit} lainnya`}</button>` : ""}
            </div>`;
        });
      }
      el.innerHTML = html || `<div class="empty">Tidak ada data</div>`;
    }
    function toggleExpand(key) {
      statsExpanded[key] = !statsExpanded[key];
      renderStats();
    }
    document.getElementById("statsSearch").addEventListener("input", () => { if (statsCache) renderStats(); });
    document.getElementById("statsSort").addEventListener("change", () => { if (statsCache) renderStats(); });

    // ===================== MATRIX SIGNAL =====================
    async function loadMatrix() {
      const sig = document.getElementById("matrixSignal").value;
      if (!sig) return alert("Pilih signal terlebih dahulu");
      const el = document.getElementById("statsResult");
      const info = document.getElementById("matrixInfo");
      const btnDownload = document.getElementById("btnDownloadMatrix");
      el.innerHTML = `<div class="loading">Mengambil data 20 hari kerja terakhir...</div>`;
      info.style.display = "none";
      if (btnDownload) btnDownload.style.display = "none";
      document.getElementById("statusText").textContent = "Loading matrix...";
      const dates = getLastNWeekdays(20);
      const matrix = {};
      for (const d of dates) {
        const data = await fetchDay(d);
        data.forEach(item => {
          if (String(item.signal) !== String(sig)) return;
          const code = item.secCode || "UNKNOWN";
          if (!matrix[code]) matrix[code] = {};
          matrix[code][d] = true;
        });
      }
      const stocks = Object.keys(matrix).sort();
      if (!stocks.length) {
        el.innerHTML = `<div class="empty">Tidak ada emiten dengan signal ini dalam 20 hari kerja terakhir</div>`;
        document.getElementById("statusText").textContent = "Matrix: 0 data";
        matrixData = null;
        return;
      }
      matrixData = {
        signal: Number(sig),
        signalName: getSignalName(sig),
        generatedAt: new Date().toISOString(),
        days: dates.length,
        dates,
        totalStocks: stocks.length,
        stocks: stocks.map(code => ({
          secCode: code,
          appearances: dates.filter(d => matrix[code][d]).length,
          dates: dates.filter(d => matrix[code][d])
        })),
        matrix
      };
      if (btnDownload) btnDownload.style.display = "inline-block";
      const headerDates = dates.map(d => {
        const [y, m, day] = d.split("-");
        return `${day}/${m}`;
      });
      let table = `<div class="matrix-wrap"><table class="matrix-table"><thead><tr><th>Emiten</th>${headerDates.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>`;
      stocks.forEach(code => {
        table += `<tr><td>${code}</td>`;
        dates.forEach(d => {
          const has = matrix[code][d];
          table += `<td class="${has ? 'check' : 'no-check'}">${has ? '✓' : '·'}</td>`;
        });
        table += `</tr>`;
      });
      table += `</tbody></table></div>`;
      el.innerHTML = table;
      info.style.display = "flex";
      info.innerHTML = `<span class="signal-label">${getSignalName(sig)}</span><span>${stocks.length} emiten · 20 hari kerja terakhir (geser →)</span>`;
      document.getElementById("statusText").textContent = `Matrix: ${stocks.length} emiten`;
    }
    function downloadMatrixJSON() {
      if (!matrixData) return alert("Belum ada data matrix. Klik Tampilkan dulu.");
      const jsonStr = JSON.stringify(matrixData, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const sigName = (matrixData.signalName || "signal").replace(/[^a-zA-Z0-9]/g, "_");
      a.href = url;
      a.download = `matrix_${sigName}_${getLocalDateString()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ===================== RECOMMEND =====================
    async function loadRecommend() {
      const from = document.getElementById("recFrom").value;
      const to   = document.getElementById("recTo").value;
      if (!from || !to) return alert("Pilih rentang tanggal");
      if (from > to) return alert("Tanggal 'dari' tidak boleh lebih besar dari 'sampai'");

      const el = document.getElementById("recResult");
      el.innerHTML = `<div class="loading">Mengambil data ${from} s/d ${to} (${recMode === "matrix" ? "Matrix Style" : "Raw Data"})...</div>`;
      document.getElementById("statusText").textContent = "Loading recommend...";

      const dates = getDatesInRange(from, to);
      const allData = [];
      for (const d of dates) {
        const data = await fetchDay(d);
        data.forEach(item => { item._date = d; allData.push(item); });
      }

      if (!allData.length) {
        el.innerHTML = `<div class="empty">Tidak ada data di rentang tanggal ini</div>`;
        document.getElementById("statusText").textContent = "Recommend: 0 data";
        return;
      }

      let ranked = [];

      if (recMode === "matrix") {
        // ===== MATRIX STYLE: unik per hari =====
        const stockMap = {};
        allData.forEach(item => {
          const code = item.secCode || "UNKNOWN";
          const sig = Number(item.signal);
          const date = item._date;
          if (!stockMap[code]) stockMap[code] = { bullish: {}, bearish: new Set() };
          if (BULLISH_WEIGHT[sig]) {
            if (!stockMap[code].bullish[sig]) stockMap[code].bullish[sig] = new Set();
            stockMap[code].bullish[sig].add(date);
          } else if (BEARISH_SIGNALS.has(sig)) {
            stockMap[code].bearish.add(date);
          }
        });

        ranked = Object.entries(stockMap).map(([code, info]) => {
          let buyScore = 0, buyDays = 0;
          const signalList = [];
          const allBuyDates = new Set();
          Object.entries(info.bullish).forEach(([sig, dateSet]) => {
            const days = dateSet.size;
            const weight = BULLISH_WEIGHT[sig] || 1;
            buyScore += days * weight;
            buyDays += days;
            signalList.push({ name: getSignalName(sig), days });
            dateSet.forEach(d => allBuyDates.add(d));
          });
          signalList.sort((a, b) => b.days - a.days);
          const sellDays = info.bearish.size;
          return {
            code, score: buyScore, buy: buyDays, sell: sellDays,
            ratio: buyDays / Math.max(sellDays, 1),
            days: allBuyDates.size,
            signals: signalList.map(s => `${s.name}(${s.days}x)`)
          };
        });
      } else {
        // ===== RAW DATA: setiap event =====
        const stockMap = {};
        allData.forEach(item => {
          const code = item.secCode || "UNKNOWN";
          const sig = Number(item.signal);
          if (!stockMap[code]) stockMap[code] = { buyScore: 0, buyCount: 0, sellCount: 0, signals: {}, dates: new Set() };
          const s = stockMap[code];
          s.dates.add(item._date);
          if (BULLISH_WEIGHT[sig]) {
            s.buyScore += BULLISH_WEIGHT[sig];
            s.buyCount += 1;
            s.signals[sig] = (s.signals[sig] || 0) + 1;
          } else if (BEARISH_SIGNALS.has(sig)) {
            s.sellCount += 1;
          }
        });

        ranked = Object.entries(stockMap).map(([code, info]) => {
          const signalList = Object.entries(info.signals)
            .sort((a, b) => b[1] - a[1])
            .map(([sig, cnt]) => `${getSignalName(sig)}(${cnt}x)`);
          return {
            code, score: info.buyScore, buy: info.buyCount, sell: info.sellCount,
            ratio: info.buyCount / Math.max(info.sellCount, 1),
            days: info.dates.size,
            signals: signalList
          };
        });
      }

      ranked = ranked.filter(r => r.score >= (recMode === "matrix" ? 3 : 10));
      ranked.sort((a, b) => b.score - a.score || b.ratio - a.ratio);
      const top = ranked.slice(0, 15);
      const modeLabel = recMode === "matrix" ? "Matrix Style" : "Raw Data";

      // Render
      let html = `
        <div class="rec-section">
          <h3>🔥 Top Kandidat (${from} s/d ${to}) — ${modeLabel}</h3>
          <div class="rec-table-wrap">
            <table class="rec-table">
              <thead>
                <tr><th>#</th><th>Kode</th><th>Skor</th><th>Buy</th><th>Sell</th><th>Rasio</th><th>Hari</th><th>Signal Utama</th></tr>
              </thead>
              <tbody>`;
      top.forEach((r, i) => {
        let ratioClass = "ratio-mid";
        if (r.ratio >= 2.5) ratioClass = "ratio-good";
        else if (r.ratio < 1.3) ratioClass = "ratio-bad";
        html += `<tr>
          <td>${i+1}</td>
          <td class="code">${r.code}</td>
          <td class="score">${r.score.toFixed(1)}</td>
          <td>${r.buy}</td>
          <td>${r.sell}</td>
          <td class="${ratioClass}">${r.ratio.toFixed(1)}x</td>
          <td>${r.days}</td>
          <td style="font-size:11px;color:#aaa">${r.signals.slice(0,3).join(", ")}</td>
        </tr>`;
      });
      html += `</tbody></table></div></div>`;

      // Perbandingan Cepat
      html += `
        <div class="rec-section">
          <h3>⚡ Perbandingan Cepat</h3>
          <div class="rec-table-wrap">
            <table class="rec-table">
              <thead>
                <tr><th>Kode</th><th>Skor</th><th>Rasio</th><th>Kualitas</th><th>Potensi Pump</th><th>Stabilitas</th></tr>
              </thead>
              <tbody>`;
      top.slice(0, 10).forEach(r => {
        let kualitas = "Sedang", pump = "Sedang", stabil = "Sedang", badge = "ok";
        const highScore = recMode === "matrix" ? 25 : 200;
        const midScore = recMode === "matrix" ? 20 : 150;
        if (r.score >= highScore && r.ratio >= 2) {
          kualitas = "Tinggi"; pump = "Tinggi"; stabil = "Baik"; badge = "hot";
        } else if (r.score >= midScore && r.ratio >= 2.5) {
          kualitas = "Tinggi"; pump = "Tinggi"; stabil = "Baik"; badge = "hot";
        } else if (r.score >= highScore && r.ratio < 1.5) {
          kualitas = "Tinggi"; pump = "Tinggi"; stabil = "Rendah"; badge = "ok";
        } else if (r.ratio >= 2.5) {
          kualitas = "Baik"; pump = "Sedang-Tinggi"; stabil = "Baik"; badge = "hot";
        } else if (r.ratio < 1.3) {
          kualitas = "Sedang"; pump = "Sedang"; stabil = "Rendah"; badge = "weak";
        }
        html += `<tr>
          <td class="code">${r.code}</td>
          <td class="score">${r.score.toFixed(1)}</td>
          <td>${r.ratio.toFixed(1)}x</td>
          <td><span class="rec-badge ${badge}">${kualitas}</span></td>
          <td>${pump}</td>
          <td>${stabil}</td>
        </tr>`;
      });
      html += `</tbody></table></div></div>`;

      // Kesimpulan
      const top1 = top[0];
      const cleanThreshold = recMode === "matrix" ? 12 : 80;
      const aggThreshold = recMode === "matrix" ? 25 : 200;
      const bestClean = ranked.filter(r => r.ratio >= 2.5 && r.score >= cleanThreshold).slice(0, 4);
      const bestAggressive = ranked.filter(r => r.score >= aggThreshold).slice(0, 4);

      html += `
        <div class="rec-section">
          <h3>📌 Kesimpulan Realistis</h3>
          <div class="rec-conclusion">
            <p><b>Periode:</b> ${from} s/d ${to} · Metode: <b>${modeLabel}</b></p>
            <ul>
              <li><b>Skor tertinggi:</b> ${top1 ? top1.code + " (" + top1.score.toFixed(1) + ")" : "-"}.</li>
              <li><b>Paling “bersih” (rasio tinggi):</b> ${bestClean.length ? bestClean.map(r => r.code).join(", ") : "Tidak ada yang menonjol"}.</li>
              <li><b>Agresif / momentum:</b> ${bestAggressive.length ? bestAggressive.map(r => r.code).join(", ") : "-"}.</li>
              <li>${recMode === "matrix"
                ? "Skor dihitung dari <b>berapa hari</b> signal muncul → lebih mencerminkan konsistensi."
                : "Skor dihitung dari <b>setiap kali</b> signal muncul → lebih mencerminkan intensitas/volume."}</li>
              <li>Prioritaskan yang <b>rasio Buy/Sell ≥ 2x</b> + ada signal kuat (Huge Buy / Breakout High).</li>
            </ul>
          </div>
        </div>`;

      el.innerHTML = html;
      document.getElementById("statusText").textContent = `Recommend (${modeLabel}): ${ranked.length} emiten`;
    }
  </script>
