<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matriks Perubahan Harga Saham</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1115;
      color: #e0e0e0;
      padding: 16px;
      font-size: 13px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 16px; color: #fff; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
      background: #1a1d24; padding: 14px; border-radius: 8px; align-items: flex-end;
    }
    .controls label { font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px; color: #aaa; }
    input, select, button {
      padding: 8px 12px; border-radius: 6px; border: 1px solid #333;
      background: #252830; color: #fff; font-size: 0.85rem;
    }
    button { cursor: pointer; background: #2962ff; border: none; font-weight: 600; }
    button:hover { background: #1e4fd6; }
    button:disabled { background: #444; cursor: not-allowed; }
    .btn-export-xls { background: #2e7d32; }
    .btn-export-xls:hover { background: #1b5e20; }
    .btn-export-json { background: #e65100; }
    .btn-export-json:hover { background: #bf360c; }
    .status { font-size: 0.85rem; color: #aaa; margin-bottom: 12px; }
    .progress-bar {
      height: 6px; background: #252830; border-radius: 4px; overflow: hidden; margin-bottom: 16px; display: none;
    }
    .progress-fill { height: 100%; background: #2962ff; width: 0%; transition: width 0.2s; }
    .table-wrapper {
      overflow: auto; max-height: 75vh; border: 1px solid #333; border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; text-align: center; }
    th, td { padding: 8px 10px; border: 1px solid #2a2e38; white-space: nowrap; }
    th {
      background: #252830; position: sticky; top: 0; z-index: 10; color: #90caf9; font-weight: 600;
      cursor: pointer; user-select: none;
    }
    th:hover { background: #323745; }
    th.sticky-col, td.sticky-col {
      position: sticky; left: 0; background: #1a1d24; z-index: 11; font-weight: bold; text-align: left;
    }
    th.sticky-col { z-index: 12; background: #252830; }
    tr:hover { background: #1e222d; }
    .green { color: #26a69a; font-weight: 600; }
    .red { color: #ef5350; font-weight: 600; }
    .neutral { color: #888; }
    .sort-icon { font-size: 0.7rem; margin-left: 4px; color: #ffb74d; }
    
    /* Baris Jumlah selalu di atas dan tidak ikut sort */
    tr.summary-row {
      background: #1a2332 !important;
      font-weight: 700;
      border-bottom: 2px solid #556;
      position: sticky;
      top: 33px; /* di bawah header */
      z-index: 5;
    }
    tr.summary-row td {
      background: #1a2332;
      color: #ffcc80;
    }
    tr.summary-row td.sticky-col {
      background: #1a2332;
      z-index: 13;
    }
  </style>
</head>
<body>
  <h1>Matriks Perubahan Harga Saham (%)</h1>
  <div class="controls">
    <label>From
      <input type="date" id="fromDate" value="2026-01-01">
    </label>
    <label>To
      <input type="date" id="toDate" value="2026-09-23">
    </label>
    <label>Tampilan Periode
      <select id="timeframeSelect">
        <option value="daily">Harian</option>
        <option value="weekly" selected>Mingguan</option>
        <option value="monthly">Bulanan</option>
        <option value="yearly">Tahunan</option>
      </select>
    </label>
    <label>Cari Saham
      <input type="text" id="searchStock" placeholder="Contoh: CDIA, BBCA" oninput="renderTable()">
    </label>
    <button id="btnFetch" onclick="fetchAndProcessData()">Fetch Data & Tampilkan</button>
    <button id="btnExportXls" class="btn-export-xls" onclick="exportToExcel()">Export ke XLS</button>
    <button id="btnExportJson" class="btn-export-json" onclick="exportToJson()">Export ke JSON</button>
  </div>
  <div class="status" id="statusText">Tentukan rentang tanggal lalu klik <strong>Fetch Data & Tampilkan</strong>.</div>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="table-wrapper">
    <table id="matrixTable">
      <thead>
        <tr id="tableHeader">
          <th class="sticky-col">Kode Saham</th>
          <th>Silakan Fetch Data</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="2" style="padding: 30px; color: #888;">Belum ada data yang dimuat.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <script>
    let rawStockData = {}; 
    let periodColumns = []; 
    let processedMatrix = {}; 
    let sortColumn = 'code'; 
    let sortDirection = 'asc'; 
    const baseUrl = 'https://raw.githubusercontent.com/paulgithubcode/sind/refs/heads/main/stocksummary/GetStockSummary_';
    async function fetchAndProcessData() {
      const fromVal = document.getElementById('fromDate').value;
      const toVal = document.getElementById('toDate').value;
      if (!fromVal || !toVal) return alert('Isi rentang tanggal From dan To!');
      if (fromVal > toVal) return alert('Tanggal From tidak boleh lebih besar dari To!');
      
      const btn = document.getElementById('btnFetch');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      
      btn.disabled = true;
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';
      
      const dates = [];
      let d = new Date(fromVal + 'T00:00:00Z');
      const end = new Date(toVal + 'T00:00:00Z');
      while (d <= end) {
        dates.push(d.toISOString().slice(0, 10));
        d.setUTCDate(d.getUTCDate() + 1);
      }
      
      rawStockData = {};
      let okCount = 0, completed = 0;
      const CONCURRENCY = 6;
      const queue = [...dates];
      statusText.textContent = `Mengambil data ${dates.length} hari...`;
      
      async function worker() {
        while (queue.length > 0) {
          const dateStr = queue.shift();
          try {
            const res = await fetch(baseUrl + dateStr + '.json');
            if (res.ok) {
              const json = await res.json();
              if (json && Array.isArray(json.data)) {
                json.data.forEach(row => {
                  const code = row.StockCode;
                  if (!code) return;
                  const close = +row.Close || 0;
                  const open = +row.OpenPrice || +row.Previous || close;
                  if (close === 0) return;
                  if (!rawStockData[code]) rawStockData[code] = [];
                  rawStockData[code].push({ dateStr, open, close });
                });
              }
              okCount++;
            }
          } catch (e) {}
          completed++;
          progressFill.style.width = ((completed / dates.length) * 100).toFixed(1) + '%';
        }
      }
      
      const workers = Array(CONCURRENCY).fill(0).map(() => worker());
      await Promise.all(workers);
      
      Object.keys(rawStockData).forEach(code => {
        rawStockData[code].sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      });
      
      statusText.textContent = `Selesai! Berhasil memuat ${okCount} hari data (${Object.keys(rawStockData).length} saham).`;
      btn.disabled = false;
      setTimeout(() => { progressBar.style.display = 'none'; }, 1000);
      processMatrixData();
    }
    function getWeekKey(dateStr) {
      const d = new Date(dateStr + 'T00:00:00Z');
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return `${d.getUTCFullYear()}-W${weekNo < 10 ? '0' : ''}${weekNo}`;
    }
    function processMatrixData() {
      const timeframe = document.getElementById('timeframeSelect').value;
      const periodSet = new Set();
      processedMatrix = {};
      
      Object.keys(rawStockData).forEach(code => {
        const rows = rawStockData[code];
        if (rows.length === 0) return;
        processedMatrix[code] = {};
        
        if (timeframe === 'daily') {
          rows.forEach(r => {
            periodSet.add(r.dateStr);
            processedMatrix[code][r.dateStr] = ((r.close - r.open) / r.open) * 100;
          });
        } else {
          const groups = {};
          rows.forEach(r => {
            let key = r.dateStr;
            if (timeframe === 'weekly') key = getWeekKey(r.dateStr);
            else if (timeframe === 'monthly') key = r.dateStr.slice(0, 7);
            else if (timeframe === 'yearly') key = r.dateStr.slice(0, 4);
            if (!groups[key]) groups[key] = [];
            groups[key].push(r);
          });
          Object.keys(groups).forEach(key => {
            periodSet.add(key);
            const g = groups[key];
            const firstOpen = g[0].open;
            const lastClose = g[g.length - 1].close;
            processedMatrix[code][key] = ((lastClose - firstOpen) / firstOpen) * 100;
          });
        }
      });
      
      periodColumns = Array.from(periodSet).sort((a, b) => b.localeCompare(a));
      
      if (sortColumn !== 'code' && sortColumn !== 'jumlah' && !periodColumns.includes(sortColumn)) {
        sortColumn = 'code';
        sortDirection = 'asc';
      }
      renderTable();
    }
    function setSort(col) {
      if (sortColumn === col) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = col;
        sortDirection = (col === 'code') ? 'asc' : 'desc';
      }
      renderTable();
    }
    function getPositiveCount(code) {
      let count = 0;
      periodColumns.forEach(p => {
        const val = processedMatrix[code][p];
        if (val !== undefined && val !== null && val > 0) count++;
      });
      return count;
    }
    function getSortedStocks() {
      const search = document.getElementById('searchStock').value.toUpperCase().trim();
      let stocks = Object.keys(processedMatrix);
      
      if (search) {
        stocks = stocks.filter(s => s.includes(search));
      }
      
      stocks.sort((a, b) => {
        if (sortColumn === 'code') {
          return sortDirection === 'asc' ? a.localeCompare(b) : b.localeCompare(a);
        } else if (sortColumn === 'jumlah') {
          const valA = getPositiveCount(a);
          const valB = getPositiveCount(b);
          return sortDirection === 'asc' ? valA - valB : valB - valA;
        } else {
          const valA = processedMatrix[a][sortColumn] ?? -999999;
          const valB = processedMatrix[b][sortColumn] ?? -999999;
          return sortDirection === 'asc' ? valA - valB : valB - valA;
        }
      });
      return stocks;
    }
    function formatValue(val) {
      if (val === undefined || val === null) return { text: '-', cls: 'neutral' };
      const cls = val > 0 ? 'green' : val < 0 ? 'red' : 'neutral';
      const sign = val > 0 ? '+' : '';
      return { text: `${sign}${val.toFixed(2)}%`, cls };
    }
    function renderTable() {
      const headerRow = document.getElementById('tableHeader');
      const tbody = document.getElementById('tableBody');
      const search = document.getElementById('searchStock').value.toUpperCase().trim();
      
      if (periodColumns.length === 0) {
        headerRow.innerHTML = `<th class="sticky-col">Kode Saham</th><th>Jumlah</th><th>-</th>`;
        tbody.innerHTML = `<tr><td colspan="3" style="padding: 30px; color: #888;">Tidak ada data pada periode ini.</td></tr>`;
        return;
      }
      
      // Header: Kode Saham | Jumlah | periode...
      let headerHTML = `<th class="sticky-col" onclick="setSort('code')">Kode Saham ${getSortIcon('code')}</th>`;
      headerHTML += `<th onclick="setSort('jumlah')">Jumlah ${getSortIcon('jumlah')}</th>`;
      periodColumns.forEach(p => {
        headerHTML += `<th onclick="setSort('${p}')">${p} ${getSortIcon(p)}</th>`;
      });
      headerRow.innerHTML = headerHTML;
      
      const stocks = getSortedStocks();
      
      if (stocks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${periodColumns.length + 2}" style="padding:20px; color:#888;">Saham "${search}" tidak ditemukan.</td></tr>`;
        return;
      }
      
      // Hitung jumlah saham yang positif di setiap kolom
      const colPositiveCount = {};
      periodColumns.forEach(p => colPositiveCount[p] = 0);
      
      let bodyHTML = '';
      
      // Baris JUMLAH + di paling atas (tidak ikut sort)
      bodyHTML += `<tr class="summary-row">
        <td class="sticky-col">JUMLAH +</td>
        <td>${stocks.length}</td>`;
      
      periodColumns.forEach(p => {
        // hitung dulu, nanti diisi setelah loop data
        bodyHTML += `<td data-period="${p}">0</td>`;
      });
      bodyHTML += `</tr>`;
      
      // Baris data saham (bisa di-sort)
      stocks.forEach(code => {
        const jumlah = getPositiveCount(code);
        bodyHTML += `<tr><td class="sticky-col">${code}</td><td>${jumlah}</td>`;
        
        periodColumns.forEach(p => {
          const val = processedMatrix[code][p];
          const fmt = formatValue(val);
          bodyHTML += `<td class="${fmt.cls}">${fmt.text}</td>`;
          
          if (val !== undefined && val !== null && val > 0) {
            colPositiveCount[p]++;
          }
        });
        bodyHTML += `</tr>`;
      });
      
      tbody.innerHTML = bodyHTML;
      
      // Update nilai kolom JUMLAH + setelah data dihitung
      periodColumns.forEach(p => {
        const cell = tbody.querySelector(`td[data-period="${p}"]`);
        if (cell) cell.textContent = colPositiveCount[p];
      });
    }
    function getSortIcon(col) {
      if (sortColumn !== col) return '';
      return sortDirection === 'asc' ? '▲' : '▼';
    }
    function exportToExcel() {
      if (periodColumns.length === 0 || Object.keys(processedMatrix).length === 0) {
        return alert('Tidak ada data untuk diexport. Silakan Fetch Data terlebih dahulu.');
      }
      const timeframe = document.getElementById('timeframeSelect').value;
      const fromVal = document.getElementById('fromDate').value;
      const toVal = document.getElementById('toDate').value;
      const table = document.getElementById('matrixTable');
      const wb = XLSX.utils.table_to_book(table, { sheet: "Perubahan Harga" });
      const fileName = `Saham_Updown_${timeframe}_${fromVal}_to_${toVal}.xlsx`;
      XLSX.writeFile(wb, fileName);
    }
    function exportToJson() {
      if (periodColumns.length === 0 || Object.keys(processedMatrix).length === 0) {
        return alert('Tidak ada data untuk diexport. Silakan Fetch Data terlebih dahulu.');
      }
      const timeframe = document.getElementById('timeframeSelect').value;
      const fromVal = document.getElementById('fromDate').value;
      const toVal = document.getElementById('toDate').value;
      const stocks = getSortedStocks();
      
      const exportData = [];
      
      // Baris JUMLAH + di awal
      const colPositiveCount = {};
      periodColumns.forEach(p => colPositiveCount[p] = 0);
      stocks.forEach(code => {
        periodColumns.forEach(p => {
          const val = processedMatrix[code][p];
          if (val !== undefined && val !== null && val > 0) colPositiveCount[p]++;
        });
      });
      
      const sumRow = { stockCode: "JUMLAH +", Jumlah: stocks.length };
      periodColumns.forEach(p => {
        sumRow[p] = colPositiveCount[p];
      });
      exportData.push(sumRow);
      
      stocks.forEach(code => {
        const item = { stockCode: code, Jumlah: getPositiveCount(code) };
        periodColumns.forEach(p => {
          const val = processedMatrix[code][p];
          item[p] = val !== undefined ? Number(val.toFixed(2)) : null;
        });
        exportData.push(item);
      });
      
      const jsonString = JSON.stringify(exportData, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `Saham_Updown_${timeframe}_${fromVal}_to_${toVal}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    document.getElementById('timeframeSelect').addEventListener('change', () => {
      if (Object.keys(rawStockData).length > 0) {
        processMatrixData();
      }
    });
  </script>
</body>
</html>
