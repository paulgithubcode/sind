<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattern Predictor – Radar + OHLCV</title>
  <style>
    :root {
      --bg:#0d0d0d; --card:#1a1a1a; --card-hover:#222; --border:#2a2a2a;
      --text:#e0e0e0; --text-dim:#888; --green:#00c853; --red:#ff5252;
      --blue:#42a5f5; --orange:#ffb74d;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
    .container{max-width:900px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    header h1{font-size:18px;font-weight:600}
    .status{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
    .status .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
    button,input[type="date"],input[type="search"]{background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;color-scheme:dark}
    button{cursor:pointer} button:hover{background:var(--card-hover)}
    button.primary{background:#1e3a5f;border-color:var(--blue)}
    .loading,.empty{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px}
    .section{margin-bottom:24px}
    .section h2{font-size:15px;color:var(--blue);margin-bottom:10px}
    .section h3{font-size:13px;color:var(--text-dim);margin:14px 0 8px}
    .table-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .table-toolbar input[type="search"]{flex:1;min-width:140px;max-width:280px;padding:7px 10px;font-size:12px}
    .table-toolbar .hint{font-size:11px;color:var(--text-dim)}
    .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--card)}
    table{width:100%;border-collapse:collapse;font-size:12px;min-width:560px}
    th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
    th{background:#151515;color:var(--text-dim);font-weight:500;position:sticky;top:0;user-select:none}
    th.sortable{cursor:pointer}
    th.sortable:hover{color:var(--blue)}
    th .sort-ind{margin-left:4px;font-size:10px;opacity:.5}
    th.sorted-asc .sort-ind,th.sorted-desc .sort-ind{opacity:1;color:var(--blue)}
    th.sorted-asc .sort-ind::after{content:"▲"}
    th.sorted-desc .sort-ind::after{content:"▼"}
    th:not(.sorted-asc):not(.sorted-desc) .sort-ind::after{content:"⇅"}
    tr:hover td{background:#222}
    tr.hidden-row{display:none}
    .code{font-weight:600}
    .good{color:var(--green);font-weight:600}
    .mid{color:var(--orange)}
    .bad{color:var(--red)}
    .lift-high{color:var(--green);font-weight:700}
    .summary-box{background:linear-gradient(135deg,#1a2332 0%,#1a1a1a 100%);border:1px solid #2a3a4a;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6;margin-bottom:16px}
    .summary-box ul{margin:8px 0 0 18px}
    .summary-box li{margin-bottom:4px}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
    .badge.best{background:#1b3a1b;color:var(--green)}
    .badge.bad{background:#3a1b1b;color:var(--red)}
    .note{font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.5}
    .formula-box{background:#121820;border:1px solid #2a3a4a;border-radius:12px;padding:14px 16px;font-size:12px;line-height:1.7;margin-bottom:16px;color:#b0c0d0}
    .formula-box h3{color:var(--blue);font-size:13px;margin:0 0 8px}
    .formula-box ul{margin:6px 0 0 16px}
    .formula-box li{margin-bottom:3px}
    .clk{cursor:pointer;color:var(--blue);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
    .clk:hover{color:#90caf9}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;align-items:center;justify-content:center;padding:16px}
    .modal-bg.open{display:flex}
    .modal{background:#151515;border:1px solid #2a3a4a;border-radius:14px;width:100%;max-width:720px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.55)}
    .modal-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .modal-header h3{font-size:14px;color:var(--blue);margin:0;line-height:1.4}
    .modal-header .sub{font-size:11px;color:var(--text-dim);margin-top:4px}
    .modal-close{background:transparent;border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;line-height:1}
    .modal-close:hover{background:#222;color:#fff}
    .modal-body{padding:12px 16px;overflow-y:auto;font-size:12px}
    .modal-body .rumus{background:#1a2332;border-radius:8px;padding:10px 12px;margin-bottom:12px;line-height:1.55;color:#b0c8e0}
    .modal-body .rumus code{background:#0d1520;padding:1px 5px;border-radius:4px;color:#9ecbff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .modal-table{width:100%;border-collapse:collapse;font-size:11.5px}
    .modal-table th,.modal-table td{padding:6px 8px;border-bottom:1px solid #252525;text-align:left}
    .modal-table th{color:var(--text-dim);background:#111;position:sticky;top:0;user-select:none}
    .modal-table th.sortable{cursor:pointer}
    .modal-table th.sortable:hover{color:var(--blue)}
    .modal-table th .sort-ind{margin-left:4px;font-size:10px;opacity:.5}
    .modal-table th.sorted-asc .sort-ind,.modal-table th.sorted-desc .sort-ind{opacity:1;color:var(--blue)}
    .modal-table th.sorted-asc .sort-ind::after{content:"▲"}
    .modal-table th.sorted-desc .sort-ind::after{content:"▼"}
    .modal-table th:not(.sorted-asc):not(.sorted-desc) .sort-ind::after{content:"⇅"}
    .modal-table .up{color:var(--green)}
    .modal-table .dn{color:var(--red)}
    .modal-footer{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim)}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Pattern Predictor · Radar + OHLCV</h1>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Ready</span></div>
    </header>
    <div class="controls">
      <input type="date" id="fromDate" />
      <span style="color:#666">s/d</span>
      <input type="date" id="toDate" />
      <button class="primary" onclick="runAnalysis()">Analisis Pola</button>
    </div>
    <div id="result"><div class="empty">Pilih rentang tanggal lalu klik Analisis Pola<br><span style="font-size:12px">Signal dari radar · Return dari Close OHLCV</span></div></div>
  </div>
  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <div><h3 id="modalTitle">Detail</h3><div class="sub" id="modalSub"></div></div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>
<script>
const RADAR_URL = "https://raw.githubusercontent.com/paulgithubcode/sind/refs/heads/main/market_radar_by_day/";
const OHLCV_URL = "https://raw.githubusercontent.com/paulgithubcode/sind/refs/heads/main/market_radar_ohlcv_by_day/";
const SIGNAL_NAMES = {
  1:"Huge Buy",2:"Huge Sell",3:"Intensive Buy",4:"Intensive Sell",
  5:"Rapid Buy",6:"Rapid Sell",7:"Large Best Bid",8:"Large Best Offer",
  9:"Nego Spike",10:"Nego Active",11:"Breakout High",12:"Breakout Low",
  13:"Quick Rebound",14:"Quick Reject"
};
const BULLISH = new Set([1,3,5,7,9,10,11,13]);
const BEARISH = new Set([2,4,6,8,12,14]);
const detailStore = {};
let detailSeq = 0;
const MAX_ROWS = 250;
function storeDetail(p){ const id="d"+(++detailSeq); detailStore[id]=p; return id; }
function openDetail(id){
  const d=detailStore[id]; if(!d) return;
  document.getElementById("modalTitle").textContent=d.title;
  document.getElementById("modalSub").textContent=d.sub||"";
  let body="";
  if(d.rumus) body+='<div class="rumus">'+d.rumus+'</div>';
  if(d.rows&&d.rows.length){
    body+='<div class="table-toolbar"><input type="search" placeholder="Cari saham..." oninput="filterModalTable(this)" />'+
      '<span class="hint">Klik header untuk sort ▲▼</span></div>';
    body+='<div style="overflow-x:auto"><table class="modal-table sortable-table" id="modalDataTable"><thead><tr>'+
      '<th>#</th><th>Saham</th><th>Hari sinyal</th><th>Hari hasil</th>'+
      '<th>Bullish</th><th>Bearish</th>'+
      '<th>Close A-1</th><th>Close A</th><th>Return</th><th>Naik?</th><th>≥2%?</th></tr></thead><tbody>';
    d.rows.forEach((r,i)=>{
      const pctCls=r.ret>0?"up":r.ret<0?"dn":"";
      const bulls=(r.bullNames||[]).join(", ")||"—";
      const bears=(r.bearNames||[]).join(", ")||"—";
      const searchHay=(r.code+" "+r.dayPrev+" "+r.dayA+" "+bulls+" "+bears).toLowerCase();
      body+='<tr data-search="'+searchHay+'">'+
        '<td data-val="'+(i+1)+'">'+(i+1)+'</td>'+
        '<td class="code" data-val="'+r.code+'">'+r.code+'</td>'+
        '<td data-val="'+r.dayPrev+'">'+r.dayPrev+'</td>'+
        '<td data-val="'+r.dayA+'">'+r.dayA+'</td>'+
        '<td data-val="'+bulls+'" style="color:var(--green);max-width:180px;white-space:normal;font-size:11px">'+bulls+'</td>'+
        '<td data-val="'+bears+'" style="color:var(--red);max-width:140px;white-space:normal;font-size:11px">'+bears+'</td>'+
        '<td data-val="'+(r.closePrev||0)+'">'+fmtPrice(r.closePrev)+'</td>'+
        '<td data-val="'+(r.closeA||0)+'">'+fmtPrice(r.closeA)+'</td>'+
        '<td class="'+pctCls+'" data-val="'+r.ret+'">'+(r.ret>=0?"+":"")+r.ret.toFixed(2)+'%</td>'+
        '<td class="'+(r.up?"up":"dn")+'" data-val="'+(r.up?1:0)+'">'+(r.up?"Ya":"Tidak")+'</td>'+
        '<td class="'+(r.strong?"up":"")+'" data-val="'+(r.strong?1:0)+'">'+(r.strong?"Ya":"Tidak")+'</td></tr>';
    });
    body+='</tbody></table></div>';
  } else body+='<p style="color:#888">Tidak ada sample.</p>';
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modalFooter").textContent=d.footer||"";
  document.getElementById("modalBg").classList.add("open");
  initTableFeatures(document.getElementById("modalBody"));
}
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
function clk(id,label){ return '<span class="clk" onclick="openDetail(\''+id+'\')">'+label+'</span>'; }
function fmtPrice(v){ if(v==null||isNaN(v)) return "—"; return Number(v).toLocaleString("id-ID"); }
function filterModalTable(input){
  const q=(input.value||"").toLowerCase().trim();
  const rows=document.querySelectorAll("#modalDataTable tbody tr");
  rows.forEach(tr=>{
    const hay=tr.getAttribute("data-search")||"";
    tr.style.display = (!q || hay.indexOf(q)>=0) ? "" : "none";
  });
}
function initTableFeatures(root){
  root=root||document;
  root.querySelectorAll("table.sortable-table").forEach(table=>{
    const thead=table.querySelector("thead");
    if(!thead) return;
    thead.querySelectorAll("th").forEach((th,colIdx)=>{
      th.classList.add("sortable");
      if(!th.querySelector(".sort-ind")){
        const ind=document.createElement("span");
        ind.className="sort-ind";
        th.appendChild(ind);
      }
      th.onclick=function(){ sortTable(table, colIdx, th); };
    });
  });
}
function sortTable(table, colIdx, th){
  const tbody=table.querySelector("tbody");
  if(!tbody) return;
  const rows=Array.from(tbody.querySelectorAll("tr"));
  const isAsc=th.classList.contains("sorted-asc");
  table.querySelectorAll("th").forEach(h=>{ h.classList.remove("sorted-asc","sorted-desc"); });
  th.classList.add(isAsc?"sorted-desc":"sorted-asc");
  const dir=isAsc?-1:1;
  rows.sort((a,b)=>{
    const aCell=a.children[colIdx];
    const bCell=b.children[colIdx];
    let av=aCell?aCell.getAttribute("data-val"):null;
    let bv=bCell?bCell.getAttribute("data-val"):null;
    if(av==null) av=aCell?aCell.textContent.trim():"";
    if(bv==null) bv=bCell?bCell.textContent.trim():"";
    const an=parseFloat(String(av).replace(/[%x+,]/g,""));
    const bn=parseFloat(String(bv).replace(/[%x+,]/g,""));
    if(!isNaN(an)&&!isNaN(bn)) return (an-bn)*dir;
    return String(av).localeCompare(String(bv),"id",{sensitivity:"base"})*dir;
  });
  rows.forEach(r=>tbody.appendChild(r));
}
function filterTable(input, tableId){
  const q=(input.value||"").toLowerCase().trim();
  const table=document.getElementById(tableId);
  if(!table) return;
  table.querySelectorAll("tbody tr").forEach(tr=>{
    const hay=(tr.getAttribute("data-search")||tr.textContent||"").toLowerCase();
    if(!q || hay.indexOf(q)>=0) tr.classList.remove("hidden-row");
    else tr.classList.add("hidden-row");
  });
}
function getLocalDateString(d){
  d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const today=getLocalDateString();
document.getElementById("fromDate").value="2026-09-11";
document.getElementById("toDate").value=today;
function getDatesInRange(from,to){
  const dates=[];
  let cur=new Date(from+"T00:00:00");
  const end=new Date(to+"T00:00:00");
  while(cur<=end){ dates.push(getLocalDateString(cur)); cur.setDate(cur.getDate()+1); }
  return dates;
}
async function fetchRadar(date){
  try{
    const res=await fetch(RADAR_URL+"radar_"+date+".json?t="+Date.now());
    if(!res.ok) return null;
    let data=await res.json();
    if(!Array.isArray(data)) data=data.list||[];
    return data;
  }catch{ return null; }
}
async function fetchOHLCV(date){
  try{
    const res=await fetch(OHLCV_URL+"GetStockSummary_"+date+".json?t="+Date.now());
    if(!res.ok) return null;
    const json=await res.json();
    const rows=json.data||json||[];
    const map={};
    for(const r of rows){
      const code=r.StockCode||r.secCode;
      if(!code) continue;
      const close=Number(r.Close);
      if(!close||close<=0) continue;
      map[code]={ close, previous:Number(r.Previous)||null, volume:Number(r.Volume)||0, change:Number(r.Change)||0 };
    }
    return map;
  }catch{ return null; }
}
function makeDetail(title,sub,rumus,subset,extraFooter){
  const rows=subset.slice(0,MAX_ROWS).map(r=>({
    code:r.code, dayPrev:r.dayPrev, dayA:r.dayA,
    closePrev:r.closePrev, closeA:r.closeA, ret:r.ret, up:r.up, strong:r.strong,
    bullNames:r.bullNames||[], bearNames:r.bearNames||[]
  }));
  const n=subset.length;
  const nUp=subset.filter(r=>r.up).length;
  const nStrong=subset.filter(r=>r.strong).length;
  const avg=n?subset.reduce((a,r)=>a+r.ret,0)/n:0;
  let footer="Total "+n+" pasangan"+(n>MAX_ROWS?" (tampil "+MAX_ROWS+" pertama)":"")+
    " · Naik: "+nUp+" ("+(n?((nUp/n)*100).toFixed(1):0)+"%)"+
    " · ≥2%: "+nStrong+" ("+(n?((nStrong/n)*100).toFixed(1):0)+"%)"+
    " · Avg: "+(avg>=0?"+":"")+avg.toFixed(2)+"%";
  if(extraFooter) footer+=" · "+extraFooter;
  return storeDetail({title,sub,rumus,rows,footer});
}
function toolbarHtml(tableId, placeholder){
  return '<div class="table-toolbar">'+
    '<input type="search" placeholder="'+(placeholder||"Cari...")+'" oninput="filterTable(this,\''+tableId+'\')" />'+
    '<span class="hint">Klik header kolom untuk sort ▲▼</span></div>';
}
async function runAnalysis(){
  const from=document.getElementById("fromDate").value;
  const to=document.getElementById("toDate").value;
  if(!from||!to) return alert("Pilih rentang tanggal");
  if(from>to) return alert("Tanggal dari tidak boleh lebih besar dari sampai");
  for(const k of Object.keys(detailStore)) delete detailStore[k];
  detailSeq=0;
  const el=document.getElementById("result");
  el.innerHTML='<div class="loading">Mengambil radar + OHLCV '+from+' s/d '+to+'...</div>';
  document.getElementById("statusText").textContent="Loading...";
  const allDates=getDatesInRange(from,to);
  const radarByDay={};
  const ohlcvByDay={};
  let loaded=0;
  for(const d of allDates){
    document.getElementById("statusText").textContent="Loading "+d+" ("+(++loaded)+"/"+allDates.length+")";
    const [radar, ohlcv]=await Promise.all([fetchRadar(d), fetchOHLCV(d)]);
    if(ohlcv && Object.keys(ohlcv).length) ohlcvByDay[d]=ohlcv;
    if(radar && radar.length){
      const byCode={};
      for(const item of radar){
        const code=item.secCode||"UNKNOWN";
        if(!byCode[code]) byCode[code]=new Set();
        if(item.signal!=null) byCode[code].add(Number(item.signal));
      }
      radarByDay[d]=byCode;
    }
  }
  const tradingDays=Object.keys(ohlcvByDay).sort();
  const signalDays=tradingDays.filter(d=>radarByDay[d]);
  if(tradingDays.length<2){
    el.innerHTML='<div class="empty">OHLCV kurang dari 2 hari di rentang ini.<br>Ditemukan: '+(tradingDays.join(", ")||"tidak ada")+'</div>';
    document.getElementById("statusText").textContent="Data kurang";
    return;
  }
  function getPairs(lag){
    const res=[];
    for(let i=lag;i<tradingDays.length;i++){
      const dayA=tradingDays[i];
      const dayPrev=tradingDays[i-lag];
      if(!radarByDay[dayPrev]) continue;
      const ohlcvPrev=ohlcvByDay[dayPrev];
      const ohlcvA=ohlcvByDay[dayA];
      if(!ohlcvPrev||!ohlcvA) continue;
      for(const code of Object.keys(radarByDay[dayPrev])){
        if(!ohlcvPrev[code]||!ohlcvA[code]) continue;
        const closePrev=ohlcvPrev[code].close;
        const closeA=ohlcvA[code].close;
        if(!closePrev||!closeA) continue;
        const ret=((closeA-closePrev)/closePrev)*100;
        const sigSet = radarByDay[dayPrev][code];
        const bullNames=[], bearNames=[];
        sigSet.forEach(s=>{
          const nm=SIGNAL_NAMES[s]||("Sig"+s);
          if(BULLISH.has(s)) bullNames.push(nm);
          if(BEARISH.has(s)) bearNames.push(nm);
        });
        res.push({
          code, dayA, dayPrev,
          signalsPrev: sigSet,
          bullNames, bearNames,
          closePrev, closeA, ret,
          up: ret>0, strong: ret>=2
        });
      }
    }
    return res;
  }

  // Formula definitions (shared for stats + edge stability)
  const FORMULAS = [
    {key:"bh", name:"Breakout High", fn:r=>r.signalsPrev.has(11)},
    {key:"bh_nolow", name:"Breakout High (tanpa Breakout Low)", fn:r=>r.signalsPrev.has(11)&&!r.signalsPrev.has(12)},
    {key:"bh_ib", name:"Breakout High + Intensive Buy", fn:r=>r.signalsPrev.has(11)&&r.signalsPrev.has(3)},
    {key:"bh_rb", name:"Breakout High + Rapid Buy", fn:r=>r.signalsPrev.has(11)&&r.signalsPrev.has(5)},
    {key:"ib", name:"Intensive Buy", fn:r=>r.signalsPrev.has(3)},
    {key:"ib_clean", name:"Intensive Buy (tanpa Intensive Sell)", fn:r=>r.signalsPrev.has(3)&&!r.signalsPrev.has(4)},
    {key:"hb", name:"Huge Buy", fn:r=>r.signalsPrev.has(1)},
    {key:"rb", name:"Rapid Buy", fn:r=>r.signalsPrev.has(5)},
    {key:"lbb", name:"Large Best Bid", fn:r=>r.signalsPrev.has(7)},
    {key:"qr", name:"Quick Rebound", fn:r=>r.signalsPrev.has(13)},
    {key:"clean2", name:"≥2 Bullish & 0 Bearish", fn:r=>{let b=0,e=0;r.signalsPrev.forEach(s=>{if(BULLISH.has(s))b++;if(BEARISH.has(s))e++;});return b>=2&&e===0;}},
    {key:"strong3", name:"≥3 Bullish & ≤1 Bearish", fn:r=>{let b=0,e=0;r.signalsPrev.forEach(s=>{if(BULLISH.has(s))b++;if(BEARISH.has(s))e++;});return b>=3&&e<=1;}},
    {key:"onlybear", name:"Hanya Bearish", fn:r=>{let b=0,e=0;r.signalsPrev.forEach(s=>{if(BULLISH.has(s))b++;if(BEARISH.has(s))e++;});return b===0&&e>=1;}},
    {key:"bl", name:"Breakout Low", fn:r=>r.signalsPrev.has(12)},
    {key:"hs", name:"Huge Sell", fn:r=>r.signalsPrev.has(2)},
  ];

  const lagResults={};
  for(const lag of [1,2,3]){
    const pairs=getPairs(lag);
    if(pairs.length<20) continue;
    const baseUp=pairs.filter(r=>r.up).length/pairs.length;
    const baseStrong=pairs.filter(r=>r.strong).length/pairs.length;
    const baseDetailId=makeDetail("Base rate — Lag "+lag,"Semua saham dengan signal apa pun di A−"+lag+" + Close di A",
      "<b>Base naik</b> = count(return Close &gt; 0) / total pairs<br>Total = <code>"+pairs.length+"</code> · Naik = <code>"+pairs.filter(r=>r.up).length+"</code><br>Return = (Close_A − Close_A−1) / Close_A−1",pairs);

    const sigStats={};
    for(let s=1;s<=14;s++){
      const subset=pairs.filter(r=>r.signalsPrev.has(s));
      if(subset.length<10) continue;
      const up=subset.filter(r=>r.up).length/subset.length;
      const strong=subset.filter(r=>r.strong).length/subset.length;
      const avgPct=subset.reduce((a,r)=>a+r.ret,0)/subset.length;
      const lift=baseUp>0?up/baseUp:0;
      const name=SIGNAL_NAMES[s]||("Sig "+s);
      const idN=makeDetail("N — "+name+" (Lag "+lag+")","Signal "+name+" di A−"+lag+", return dari Close OHLCV",
        "<b>N</b> = pasangan dengan signal <code>"+name+"</code> di hari A−"+lag+" = <code>"+subset.length+"</code>",subset);
      const idUp=makeDetail("% Naik — "+name+" (Lag "+lag+")","Return Close &gt; 0",
        "<b>% Naik</b> = count(ret&gt;0)/N = <code>"+subset.filter(r=>r.up).length+"</code>/<code>"+subset.length+"</code> = <code>"+(up*100).toFixed(1)+"%</code>",
        subset.filter(r=>r.up),"dari N="+subset.length);
      const idStrong=makeDetail("% ≥2% — "+name+" (Lag "+lag+")","Return Close ≥ 2%",
        "<b>% ≥2%</b> = count(ret≥2)/N = <code>"+subset.filter(r=>r.strong).length+"</code>/<code>"+subset.length+"</code> = <code>"+(strong*100).toFixed(1)+"%</code>",
        subset.filter(r=>r.strong),"dari N="+subset.length);
      const idAvg=makeDetail("Avg Return — "+name+" (Lag "+lag+")","Rata-rata return Close",
        "<b>Avg Return</b> = mean(ret) = <code>"+(avgPct>=0?"+":"")+avgPct.toFixed(2)+"%</code>",subset);
      const idLift=makeDetail("Lift — "+name+" (Lag "+lag+")","vs base rate",
        "<b>Lift</b> = upRate/baseUp = <code>"+(up*100).toFixed(1)+"%</code>/<code>"+(baseUp*100).toFixed(1)+"%</code> = <code>"+lift.toFixed(2)+"x</code>",subset);
      sigStats[s]={n:subset.length,upRate:up,strongRate:strong,avgPct,lift,idN,idUp,idStrong,idAvg,idLift};
    }

    const formulaStats=[];
    for(const f of FORMULAS){
      const subset=pairs.filter(f.fn);
      if(subset.length<10) continue;
      const up=subset.filter(r=>r.up).length/subset.length;
      const strong=subset.filter(r=>r.strong).length/subset.length;
      const avgPct=subset.reduce((a,r)=>a+r.ret,0)/subset.length;
      const lift=baseUp>0?up/baseUp:0;
      const idN=makeDetail("N — "+f.name+" (Lag "+lag+")","Pola di A−"+lag+", return Close",
        "<b>N</b> = pasangan pola <code>"+f.name+"</code> = <code>"+subset.length+"</code>",subset);
      const idUp=makeDetail("% Naik — "+f.name+" (Lag "+lag+")","Return Close &gt; 0",
        "<b>% Naik</b> = <code>"+subset.filter(r=>r.up).length+"</code>/<code>"+subset.length+"</code> = <code>"+(up*100).toFixed(1)+"%</code>",
        subset.filter(r=>r.up),"dari N="+subset.length);
      const idStrong=makeDetail("% ≥2% — "+f.name+" (Lag "+lag+")","Return ≥ 2%",
        "<b>% ≥2%</b> = <code>"+subset.filter(r=>r.strong).length+"</code>/<code>"+subset.length+"</code> = <code>"+(strong*100).toFixed(1)+"%</code>",
        subset.filter(r=>r.strong),"dari N="+subset.length);
      const idAvg=makeDetail("Avg Return — "+f.name+" (Lag "+lag+")","mean Close return",
        "<b>Avg Return</b> = <code>"+(avgPct>=0?"+":"")+avgPct.toFixed(2)+"%</code>",subset);
      const idLift=makeDetail("Lift — "+f.name+" (Lag "+lag+")","vs base",
        "<b>Lift</b> = <code>"+(up*100).toFixed(1)+"%</code>/<code>"+(baseUp*100).toFixed(1)+"%</code> = <code>"+lift.toFixed(2)+"x</code>",subset);
      formulaStats.push({key:f.key,name:f.name,fn:f.fn,n:subset.length,upRate:up,strongRate:strong,avgPct,lift,idN,idUp,idStrong,idAvg,idLift});
    }
    formulaStats.sort((a,b)=>b.lift-a.lift||b.upRate-a.upRate);

    // ===== STABILITY: individual signals (top by lift) + formulas =====
    const topSigIds=Object.entries(sigStats).sort((a,b)=>b[1].lift-a[1].lift).slice(0,5).map(([id])=>Number(id));
    const worst=Object.entries(sigStats).sort((a,b)=>a[1].lift-b[1].lift)[0];
    if(worst&&!topSigIds.includes(Number(worst[0]))) topSigIds.push(Number(worst[0]));

    // top formulas for edge table (all with enough sample, max ~8)
    const edgeFormulas = formulaStats.slice(0, 8);

    // day edges for signals
    const dayEdgesBySig={};
    for(const sigId of topSigIds){
      dayEdgesBySig[sigId]=[];
      for(let i=lag;i<tradingDays.length;i++){
        const dayA=tradingDays[i], dayPrev=tradingDays[i-lag];
        const dayPairs=pairs.filter(r=>r.dayA===dayA);
        if(!dayPairs.length) continue;
        const dayBase=dayPairs.filter(r=>r.up).length/dayPairs.length;
        const subset=dayPairs.filter(r=>r.signalsPrev.has(sigId));
        if(subset.length<5) continue;
        const upRate=subset.filter(r=>r.up).length/subset.length;
        const edge=upRate-dayBase;
        const name=SIGNAL_NAMES[sigId]||("Sig "+sigId);
        const idEdge=makeDetail("Edge "+name+" · "+dayPrev.slice(5)+" → "+dayA.slice(5),"Lag "+lag,
          "<b>Edge</b> = upRate − base = <code>"+(upRate*100).toFixed(1)+"%</code> − <code>"+(dayBase*100).toFixed(1)+"%</code> = <code>"+(edge*100).toFixed(1)+"%</code><br>N = "+subset.length,subset);
        dayEdgesBySig[sigId].push({from:dayPrev,to:dayA,n:subset.length,upRate,base:dayBase,edge,idEdge});
      }
    }

    // day edges for FORMULAS
    const dayEdgesByFormula={};
    for(const f of edgeFormulas){
      dayEdgesByFormula[f.key]=[];
      for(let i=lag;i<tradingDays.length;i++){
        const dayA=tradingDays[i], dayPrev=tradingDays[i-lag];
        const dayPairs=pairs.filter(r=>r.dayA===dayA);
        if(!dayPairs.length) continue;
        const dayBase=dayPairs.filter(r=>r.up).length/dayPairs.length;
        const subset=dayPairs.filter(f.fn);
        if(subset.length<5) continue;
        const upRate=subset.filter(r=>r.up).length/subset.length;
        const edge=upRate-dayBase;
        const idEdge=makeDetail("Edge "+f.name+" · "+dayPrev.slice(5)+" → "+dayA.slice(5),"Lag "+lag+" · Formula",
          "<b>Edge</b> = upRate − base = <code>"+(upRate*100).toFixed(1)+"%</code> − <code>"+(dayBase*100).toFixed(1)+"%</code> = <code>"+(edge*100).toFixed(1)+"%</code><br>N = "+subset.length+" · Pola: <code>"+f.name+"</code>",subset);
        dayEdgesByFormula[f.key].push({from:dayPrev,to:dayA,n:subset.length,upRate,base:dayBase,edge,idEdge,name:f.name});
      }
    }

    lagResults[lag]={
      pairs:pairs.length,baseUp,baseStrong,baseDetailId,
      sigStats,formulaStats,topSigIds,dayEdgesBySig,
      edgeFormulas,dayEdgesByFormula
    };
  }

  if(!Object.keys(lagResults).length){
    el.innerHTML='<div class="empty">Data tidak cukup (butuh radar + OHLCV overlap ≥2 hari bursa)</div>';
    return;
  }

  let html='<div class="formula-box"><h3>📌 Metode (Radar + OHLCV)</h3><ul>'+
    '<li><b>Signal</b> = dari radar di hari A−lag</li>'+
    '<li><b>Return</b> = (Close_A − Close_A−1) / Close_A−1 dari OHLCV</li>'+
    '<li><b>Pair</b> = signal di A−lag + Close di A−lag dan A</li>'+
    '<li>Angka <span class="clk">biru bergaris</span> = klik untuk detail saham</li>'+
    '<li>Tabel: <b>klik header</b> untuk sort ASC/DESC · kotak search untuk filter</li>'+
    '<li>Hari OHLCV: <b>'+tradingDays.length+'</b> · Hari radar: <b>'+signalDays.length+'</b></li></ul></div>';

  const lag1=lagResults[1];
  if(lag1&&lag1.formulaStats.length){
    const best=lag1.formulaStats[0], worst=lag1.formulaStats[lag1.formulaStats.length-1];
    html+='<div class="summary-box"><b>Ringkasan ('+from+' s/d '+to+')</b><ul>'+
      '<li>Hari bursa (OHLCV): <b>'+tradingDays.length+'</b> ('+tradingDays.join(", ")+')</li>'+
      '<li>'+clk(lag1.baseDetailId,"Base rate naik (lag-1)")+': <b>'+(lag1.baseUp*100).toFixed(1)+'%</b></li>'+
      '<li>Pola terbaik: <span class="badge best">'+best.name+'</span> → naik <b>'+(best.upRate*100).toFixed(1)+'%</b> ('+
      clk(best.idLift,"lift")+' '+best.lift.toFixed(2)+'x), avg <b>'+(best.avgPct>=0?"+":"")+best.avgPct.toFixed(2)+'%</b> · '+
      clk(best.idN,"lihat "+best.n+" saham")+'</li>'+
      '<li>Pola terlemah: <span class="badge bad">'+worst.name+'</span> → naik '+(worst.upRate*100).toFixed(1)+'% (lift '+worst.lift.toFixed(2)+'x)</li></ul></div>';
  }

  let tableSeq=0;
  for(const lag of [1,2,3]){
    const L=lagResults[lag]; if(!L) continue;
    html+='<div class="section"><h2>Lag '+lag+' — Signal A−'+lag+' → Close return hari A</h2>';
    html+='<p class="note">Sample: '+L.pairs+' pasangan · '+clk(L.baseDetailId,"Base naik")+': '+(L.baseUp*100).toFixed(1)+'% · Base ≥2%: '+(L.baseStrong*100).toFixed(1)+'%</p>';

    // Signal individu
    const sigRows=Object.entries(L.sigStats).map(([sig,st])=>({sig:Number(sig),...st})).sort((a,b)=>b.lift-a.lift);
    const sigTid="tbl-sig-"+lag+"-"+(++tableSeq);
    html+='<h3>Signal Individu</h3>'+toolbarHtml(sigTid,"Cari signal...")+
      '<div class="table-wrap"><table class="sortable-table" id="'+sigTid+'"><thead><tr>'+
      '<th>Signal</th><th>N</th><th>% Naik</th><th>% ≥2%</th><th>Avg Return</th><th>Lift</th></tr></thead><tbody>';
    sigRows.forEach(r=>{
      const cls=r.lift>=1.2?"good":r.lift<=0.8?"bad":"mid";
      const liftCls=r.lift>=1.3?"lift-high":cls;
      const name=SIGNAL_NAMES[r.sig]||("Sig "+r.sig);
      html+='<tr data-search="'+name.toLowerCase()+'">'+
        '<td class="code" data-val="'+name+'">'+name+'</td>'+
        '<td data-val="'+r.n+'">'+clk(r.idN,r.n)+'</td>'+
        '<td class="'+cls+'" data-val="'+r.upRate+'">'+clk(r.idUp,(r.upRate*100).toFixed(1)+"%")+'</td>'+
        '<td data-val="'+r.strongRate+'">'+clk(r.idStrong,(r.strongRate*100).toFixed(1)+"%")+'</td>'+
        '<td class="'+(r.avgPct>=0?"good":"bad")+'" data-val="'+r.avgPct+'">'+clk(r.idAvg,(r.avgPct>=0?"+":"")+r.avgPct.toFixed(2)+"%")+'</td>'+
        '<td class="'+liftCls+'" data-val="'+r.lift+'">'+clk(r.idLift,r.lift.toFixed(2)+"x")+'</td></tr>';
    });
    html+='</tbody></table></div>';

    // Formula
    const formTid="tbl-form-"+lag+"-"+(++tableSeq);
    html+='<h3>Formula / Kombinasi</h3>'+toolbarHtml(formTid,"Cari pola...")+
      '<div class="table-wrap"><table class="sortable-table" id="'+formTid+'"><thead><tr>'+
      '<th>Pola</th><th>N</th><th>% Naik</th><th>% ≥2%</th><th>Avg Return</th><th>Lift</th></tr></thead><tbody>';
    L.formulaStats.forEach((r,i)=>{
      const cls=r.lift>=1.2?"good":r.lift<=0.8?"bad":"mid";
      const liftCls=r.lift>=1.3?"lift-high":cls;
      const badge=i===0&&r.lift>=1.2?'<span class="badge best">BEST</span> ':"";
      html+='<tr data-search="'+r.name.toLowerCase()+'">'+
        '<td class="code" data-val="'+r.name+'">'+badge+r.name+'</td>'+
        '<td data-val="'+r.n+'">'+clk(r.idN,r.n)+'</td>'+
        '<td class="'+cls+'" data-val="'+r.upRate+'">'+clk(r.idUp,(r.upRate*100).toFixed(1)+"%")+'</td>'+
        '<td data-val="'+r.strongRate+'">'+clk(r.idStrong,(r.strongRate*100).toFixed(1)+"%")+'</td>'+
        '<td class="'+(r.avgPct>=0?"good":"bad")+'" data-val="'+r.avgPct+'">'+clk(r.idAvg,(r.avgPct>=0?"+":"")+r.avgPct.toFixed(2)+"%")+'</td>'+
        '<td class="'+liftCls+'" data-val="'+r.lift+'">'+clk(r.idLift,r.lift.toFixed(2)+"x")+'</td></tr>';
    });
    html+='</tbody></table></div>';

    // ===== STABILITAS EDGE: Signal + Formula =====
    html+='<h3>Stabilitas Edge (Signal + Formula)</h3>';
    html+='<p class="note">Edge = (% naik pola) − (base rate hari itu). Minimal 5 sample per hari. Klik edge untuk detail.</p>';

    // Collect all day pairs from both signals and formulas
    const allDayPairs=new Set();
    for(const sigId of L.topSigIds) (L.dayEdgesBySig[sigId]||[]).forEach(e=>allDayPairs.add(e.from+"|"+e.to));
    for(const f of L.edgeFormulas) (L.dayEdgesByFormula[f.key]||[]).forEach(e=>allDayPairs.add(e.from+"|"+e.to));
    const dayPairList=[...allDayPairs].sort();

    if(dayPairList.length){
      // --- Signal rows ---
      if(L.topSigIds.length){
        const edgeTid="tbl-edge-sig-"+lag+"-"+(++tableSeq);
        html+='<h3 style="font-size:12px;margin-top:12px">▸ Signal individu</h3>'+toolbarHtml(edgeTid,"Cari signal...")+
          '<div class="table-wrap"><table class="sortable-table" id="'+edgeTid+'"><thead><tr><th>Signal</th>';
        dayPairList.forEach(dp=>{const [a,b]=dp.split("|");html+='<th>'+a.slice(5)+'→'+b.slice(5)+'</th>';});
        html+='<th>Rata Edge</th><th>#hari +</th></tr></thead><tbody>';
        for(const sigId of L.topSigIds){
          const edges=L.dayEdgesBySig[sigId]||[];
          const edgeMap={}; edges.forEach(e=>{edgeMap[e.from+"|"+e.to]=e;});
          let sumEdge=0,cntEdge=0,posDays=0;
          const name=SIGNAL_NAMES[sigId]||("Sig "+sigId);
          html+='<tr data-search="'+name.toLowerCase()+'"><td class="code" data-val="'+name+'">'+name+'</td>';
          dayPairList.forEach(dp=>{
            const e=edgeMap[dp];
            if(!e){html+='<td style="color:#444" data-val="">—</td>';return;}
            sumEdge+=e.edge;cntEdge++;if(e.edge>0)posDays++;
            const cls=e.edge>0.05?"good":e.edge<-0.05?"bad":"mid";
            const label=(e.edge>=0?"+":"")+(e.edge*100).toFixed(0)+'% <span style="color:#666;font-size:10px">('+e.n+')</span>';
            html+='<td class="'+cls+'" data-val="'+e.edge+'">'+clk(e.idEdge,label)+'</td>';
          });
          const avgEdge=cntEdge?sumEdge/cntEdge:0;
          const avgCls=avgEdge>0.05?"good":avgEdge<-0.05?"bad":"mid";
          html+='<td class="'+avgCls+'" data-val="'+avgEdge+'">'+(avgEdge>=0?"+":"")+(avgEdge*100).toFixed(1)+'%</td>';
          html+='<td data-val="'+posDays+'">'+posDays+'/'+cntEdge+'</td></tr>';
        }
        html+='</tbody></table></div>';
      }

      // --- Formula rows ---
      if(L.edgeFormulas.length){
        const edgeFTid="tbl-edge-form-"+lag+"-"+(++tableSeq);
        html+='<h3 style="font-size:12px;margin-top:14px">▸ Formula / Kombinasi</h3>'+toolbarHtml(edgeFTid,"Cari pola...")+
          '<div class="table-wrap"><table class="sortable-table" id="'+edgeFTid+'"><thead><tr><th>Pola</th>';
        dayPairList.forEach(dp=>{const [a,b]=dp.split("|");html+='<th>'+a.slice(5)+'→'+b.slice(5)+'</th>';});
        html+='<th>Rata Edge</th><th>#hari +</th></tr></thead><tbody>';
        for(const f of L.edgeFormulas){
          const edges=L.dayEdgesByFormula[f.key]||[];
          const edgeMap={}; edges.forEach(e=>{edgeMap[e.from+"|"+e.to]=e;});
          let sumEdge=0,cntEdge=0,posDays=0;
          html+='<tr data-search="'+f.name.toLowerCase()+'"><td class="code" data-val="'+f.name+'">'+f.name+'</td>';
          dayPairList.forEach(dp=>{
            const e=edgeMap[dp];
            if(!e){html+='<td style="color:#444" data-val="">—</td>';return;}
            sumEdge+=e.edge;cntEdge++;if(e.edge>0)posDays++;
            const cls=e.edge>0.05?"good":e.edge<-0.05?"bad":"mid";
            const label=(e.edge>=0?"+":"")+(e.edge*100).toFixed(0)+'% <span style="color:#666;font-size:10px">('+e.n+')</span>';
            html+='<td class="'+cls+'" data-val="'+e.edge+'">'+clk(e.idEdge,label)+'</td>';
          });
          const avgEdge=cntEdge?sumEdge/cntEdge:0;
          const avgCls=avgEdge>0.05?"good":avgEdge<-0.05?"bad":"mid";
          html+='<td class="'+avgCls+'" data-val="'+avgEdge+'">'+(avgEdge>=0?"+":"")+(avgEdge*100).toFixed(1)+'%</td>';
          html+='<td data-val="'+posDays+'">'+posDays+'/'+cntEdge+'</td></tr>';
        }
        html+='</tbody></table></div>';
      }
    } else {
      html+='<p class="note">Tidak ada pasangan hari dengan sample cukup (≥5).</p>';
    }

    html+='</div>';
  }

  if(lag1&&lag1.formulaStats.length){
    const top3=lag1.formulaStats.slice(0,3);
    const avoid=lag1.formulaStats.filter(r=>r.lift<=0.7).slice(0,3);
    html+='<div class="section"><h2>📌 Rekomendasi Pola</h2><div class="summary-box">';
    html+='<b>Pola layak dipakai (lag-1, return Close):</b><ul>';
    top3.forEach((r,i)=>{
      html+='<li><b>'+(i+1)+'. '+r.name+'</b> — naik '+(r.upRate*100).toFixed(1)+'%, lift '+r.lift.toFixed(2)+'x · '+clk(r.idN,"lihat "+r.n+" saham")+'</li>';
    });
    html+='</ul>';
    if(avoid.length){
      html+='<b style="margin-top:10px;display:block">Sebaiknya dihindari:</b><ul>';
      avoid.forEach(r=>{html+='<li><b>'+r.name+'</b> — naik '+(r.upRate*100).toFixed(1)+'%, lift '+r.lift.toFixed(2)+'x</li>';});
      html+='</ul>';
    }
    html+='<p class="note" style="margin-top:12px">Return dari Close OHLCV. Klik angka biru untuk detail. Stabilitas edge mencakup signal + formula.</p></div></div>';
  }

  el.innerHTML=html;
  initTableFeatures(el);
  document.getElementById("statusText").textContent="Done · "+tradingDays.length+" hari OHLCV · "+signalDays.length+" hari radar";
}
</script>
</body>
</html>
