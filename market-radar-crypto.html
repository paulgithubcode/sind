<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Breakout High Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      line-height: 1.4;
    }
    h1 { font-size: 1.35rem; margin-bottom: 6px; color: #f8fafc; }
    .meta { color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 9px 18px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .tab-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .tab-btn:hover:not(.active) { background: #334155; color: #e2e8f0; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-bottom: 14px; align-items: center;
    }
    select, button, input[type="text"] {
      padding: 9px 14px; border-radius: 8px;
      border: 1px solid #334155; background: #1e293b;
      color: #e2e8f0; font-size: 0.9rem;
    }
    input[type="text"] {
      min-width: 240px;
    }
    input[type="text"]::placeholder {
      color: #64748b;
    }
    button {
      background: #3b82f6; border: none; cursor: pointer; font-weight: 500;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status {
      margin-bottom: 12px; padding: 10px 14px;
      border-radius: 8px; font-size: 0.88rem;
    }
    .status.loading { background: #1e293b; color: #94a3b8; }
    .status.error { background: #7f1d1d; color: #fecaca; }
    .status.success { background: #14532d; color: #bbf7d0; }
    .progress { font-size: 0.82rem; color: #94a3b8; margin-bottom: 10px; }
    .table-wrapper {
      overflow: auto;
      max-height: 75vh;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    table {
      border-collapse: collapse;
      font-size: 0.78rem;
      min-width: 100%;
    }
    th, td {
      padding: 6px 8px;
      text-align: center;
      white-space: nowrap;
      border-bottom: 1px solid #1e293b;
    }
    th {
      background: #1e293b;
      color: #f1f5f9;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
      cursor: pointer;
      user-select: none;
    }
    th:hover { background: #334155; }
    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: #1e293b;
      z-index: 3;
      min-width: 90px;
    }
    th:nth-child(2), td:nth-child(2) {
      position: sticky;
      left: 90px;
      background: #1e293b;
      z-index: 3;
      min-width: 50px;
    }
    tr:nth-child(even) td { background: #0f172a; }
    tr:nth-child(odd) td { background: #111827; }
    tr:hover td { background: #1e293b; }
    .check { color: #4ade80; font-weight: 700; font-size: 0.95rem; }
    .muted { color: #64748b; }
    .jml { font-weight: 600; color: #93c5fd; }
    .sort-asc::after { content: " ▲"; font-size: 0.7rem; }
    .sort-desc::after { content: " ▼"; font-size: 0.7rem; }
    .hint {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
      width: 100%;
    }
    .search-wrapper {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>Crypto Breakout High Matrix</h1>
  <p class="meta">Klik header kolom untuk mengurutkan · Concurrent optimized (tanpa cache)</p>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabSwing" onclick="switchTab('swing')">Swing Trade</button>
    <button class="tab-btn" id="tabScalping" onclick="switchTab('scalping')">Scalping</button>
  </div>

  <!-- Controls Swing -->
  <div class="controls" id="controlsSwing">
    <select id="periodSelect">
      <option value="7">Breakout Period: 1W (7 hari)</option>
      <option value="14">Breakout Period: 2W (14 hari)</option>
      <option value="30" selected>Breakout Period: 1M (30 hari) — Rekomendasi</option>
      <option value="90">Breakout Period: 3M (90 hari)</option>
      <option value="180">Breakout Period: 6M (180 hari)</option>
      <option value="365">Breakout Period: 1Y (365 hari)</option>
    </select>
    <button id="scanBtn" onclick="startScan()">Tampilkan</button>
  </div>

  <!-- Controls Scalping -->
  <div class="controls" id="controlsScalping" style="display:none;">
    <select id="tfSelect">
      <option value="15">TF: 15 menit</option>
      <option value="30" selected>TF: 30 menit (Rekomendasi)</option>
      <option value="60">TF: 1 Jam</option>
      <option value="240">TF: 4 Jam</option>
    </select>
    <select id="lookbackSelect">
      <option value="1">Lookback: 1 hari</option>
      <option value="2" selected>Lookback: 2 hari (Rekomendasi)</option>
      <option value="3">Lookback: 3 hari</option>
      <option value="5">Lookback: 5 hari</option>
      <option value="7">Lookback: 1 minggu</option>
    </select>
    <button id="scanBtnScalp" onclick="startScan()">Tampilkan</button>
    <div class="hint">
      Rekomendasi: TF 30m + Lookback 1–2 hari · TF 15m + Lookback 1 hari · TF 1H/4H + Lookback 2–5 hari
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="Cari pair... (contoh: BTC, ETH, PEPE)" oninput="filterTable()">
  </div>

  <div id="status" class="status" style="display:none;"></div>
  <div class="progress" id="progress"></div>
  <div class="table-wrapper">
    <div id="tableContainer"></div>
  </div>

  <script>
    const PAIRS_URL = "https://raw.githubusercontent.com/paulgithubcode/sind/main/pairs.json";
    const HISTORY_BASE = "https://indodax.com/tradingview/history_v2";

    // Pengaturan lebih aman
    const CONCURRENCY = 3;
    const DELAY_AFTER_REQUEST = 300; // ms
    const RETRY_DELAY = 1600;

    let allPairs = [];
    let isScanning = false;
    let currentMode = "swing";
    let currentTf = "1d";
    let currentResults = [];
    let currentDates = [];
    let sortState = { key: "count", asc: false };

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById("tabSwing").classList.toggle("active", mode === "swing");
      document.getElementById("tabScalping").classList.toggle("active", mode === "scalping");
      document.getElementById("controlsSwing").style.display = mode === "swing" ? "flex" : "none";
      document.getElementById("controlsScalping").style.display = mode === "scalping" ? "flex" : "none";

      document.getElementById("searchInput").value = "";
      document.getElementById("tableContainer").innerHTML = "";
      document.getElementById("progress").textContent = "";
      document.getElementById("status").style.display = "none";
    }

    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.className = `status ${type}`;
      el.textContent = msg;
    }

    function getUnixTime(daysAgo = 0) {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      return Math.floor(d.getTime() / 1000);
    }

    function formatKey(ts) {
      const d = new Date(ts * 1000);
      const day = String(d.getDate()).padStart(2, "0");
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const hour = String(d.getHours()).padStart(2, "0");
      const minute = String(d.getMinutes()).padStart(2, "0");

      if (currentMode === "swing") {
        return `${day}/${month}`;
      }
      if (currentTf === "15" || currentTf === "30") {
        return `${day}/${month} ${hour}:${minute}`;
      }
      return `${day}/${month} ${hour}:00`;
    }

    function parseKeyToDate(key) {
      const now = new Date();
      const year = now.getFullYear();
      if (key.includes(" ")) {
        const [datePart, timePart] = key.split(" ");
        const [day, month] = datePart.split("/").map(Number);
        const [hour, minute = 0] = timePart.split(":").map(Number);
        return new Date(year, month - 1, day, hour, minute);
      } else {
        const [day, month] = key.split("/").map(Number);
        return new Date(year, month - 1, day);
      }
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function loadPairs() {
      const res = await fetch(PAIRS_URL);
      if (!res.ok) throw new Error("Gagal load pairs.json");
      const data = await res.json();
      allPairs = data.filter(p =>
        p.id.endsWith("idr") &&
        p.is_maintenance === 0 &&
        p.is_market_suspended === 0
      );
      return allPairs;
    }

    async function fetchHistory(symbol, from, to, tf = "1d", isRetry = false) {
      const url = `${HISTORY_BASE}?from=${from}&to=${to}&symbol=${symbol}&tf=${tf}`;
      const res = await fetch(url);

      if (res.status === 429) {
        if (!isRetry) {
          console.warn(`429 pada ${symbol}, retry...`);
          await sleep(RETRY_DELAY);
          return fetchHistory(symbol, from, to, tf, true);
        }
        throw new Error("429 Too Many Requests");
      }

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    function findBreakoutDays(candles) {
      if (!candles || candles.length < 2) return null;

      candles.sort((a, b) => a.Time - b.Time);

      const breakoutMap = {};
      let runningHigh = -Infinity;
      let count = 0;

      candles.forEach(c => {
        const key = formatKey(c.Time);
        if (c.High > runningHigh) {
          runningHigh = c.High;
          breakoutMap[key] = true;
          count++;
        }
      });

      return {
        symbol: null,
        breakoutMap,
        count,
        dates: candles.map(c => formatKey(c.Time))
      };
    }

    async function runWithConcurrency(items, concurrency, worker) {
      const results = [];
      let index = 0;
      let active = 0;
      let completed = 0;

      return new Promise((resolve) => {
        const next = () => {
          while (active < concurrency && index < items.length) {
            const i = index++;
            active++;

            worker(items[i], i)
              .then(res => results[i] = res)
              .catch(err => results[i] = { error: err })
              .finally(async () => {
                active--;
                completed++;
                document.getElementById("progress").textContent =
                  `Progress: ${completed}/${items.length}`;

                await sleep(DELAY_AFTER_REQUEST);

                if (completed === items.length) {
                  resolve(results);
                } else {
                  next();
                }
              });
          }
        };
        next();
      });
    }

    function sortResults(key) {
      if (sortState.key === key) {
        sortState.asc = !sortState.asc;
      } else {
        sortState.key = key;
        sortState.asc = true;
      }

      currentResults.sort((a, b) => {
        let valA, valB;
        if (key === "symbol") {
          valA = a.symbol;
          valB = b.symbol;
          return sortState.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        if (key === "count") {
          valA = a.count;
          valB = b.count;
          return sortState.asc ? valA - valB : valB - valA;
        }
        valA = a.breakoutMap[key] ? 1 : 0;
        valB = b.breakoutMap[key] ? 1 : 0;
        return sortState.asc ? valA - valB : valB - valA;
      });

      renderMatrix();
    }

    function getFilteredResults() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!q) return currentResults;
      return currentResults.filter(r => r.symbol.toLowerCase().includes(q));
    }

    function filterTable() {
      renderMatrix();
    }

    function renderMatrix() {
      const container = document.getElementById("tableContainer");
      const filtered = getFilteredResults();

      if (currentResults.length === 0) {
        container.innerHTML = `<p class="muted" style="padding:16px;">Tidak ada data.</p>`;
        return;
      }

      if (filtered.length === 0) {
        container.innerHTML = `<p class="muted" style="padding:16px;">Tidak ada pair yang cocok dengan pencarian.</p>`;
        return;
      }

      const getSortClass = (key) => {
        if (sortState.key !== key) return "";
        return sortState.asc ? "sort-asc" : "sort-desc";
      };

      let html = `
        <table>
          <thead>
            <tr>
              <th class="${getSortClass("symbol")}" onclick="sortResults('symbol')">Pair</th>
              <th class="${getSortClass("count")}" onclick="sortResults('count')">Jml</th>
              ${currentDates.map(d =>
                `<th class="${getSortClass(d)}" onclick="sortResults('${d}')">${d}</th>`
              ).join("")}
            </tr>
          </thead>
          <tbody>
      `;

      filtered.forEach(r => {
        html += `
          <tr>
            <td><strong>${r.symbol}</strong></td>
            <td class="jml">${r.count}</td>
            ${currentDates.map(d => {
              return r.breakoutMap[d]
                ? `<td class="check">✓</td>`
                : `<td class="muted">·</td>`;
            }).join("")}
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    async function startScan() {
      if (isScanning) return;
      isScanning = true;

      const btn = currentMode === "swing"
        ? document.getElementById("scanBtn")
        : document.getElementById("scanBtnScalp");

      btn.disabled = true;
      document.getElementById("tableContainer").innerHTML = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("progress").textContent = "";

      const startTime = performance.now();

      try {
        if (allPairs.length === 0) {
          showStatus("Memuat daftar pairs...", "loading");
          await loadPairs();
        }

        let periodDays, tf;

        if (currentMode === "swing") {
          periodDays = parseInt(document.getElementById("periodSelect").value);
          tf = "1d";
        } else {
          periodDays = parseInt(document.getElementById("lookbackSelect").value);
          tf = document.getElementById("tfSelect").value;
        }

        currentTf = tf;
        const to = getUnixTime(0);
        const from = getUnixTime(periodDays + 1);

        showStatus(
          `Scanning ${allPairs.length} pairs | Mode: ${currentMode.toUpperCase()} | TF: ${tf} | Lookback: ${periodDays} hari`,
          "loading"
        );

        let success = 0;
        let failed = 0;
        const results = [];
        const allDatesSet = new Set();

        const worker = async (pair) => {
          try {
            const candles = await fetchHistory(pair.id, from, to, tf);
            const analysis = findBreakoutDays(candles);

            if (analysis && analysis.count > 0) {
              analysis.symbol = pair.symbol;
              results.push(analysis);
              analysis.dates.forEach(d => allDatesSet.add(d));
              success++;
            }
          } catch (err) {
            failed++;
            console.warn(`Gagal ${pair.id}:`, err.message);
          }
        };

        await runWithConcurrency(allPairs, CONCURRENCY, worker);

        currentDates = Array.from(allDatesSet).sort((a, b) => {
          return parseKeyToDate(b) - parseKeyToDate(a);
        });

        currentResults = results;
        sortState = { key: "count", asc: false };

        const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);

        showStatus(
          `Selesai dalam ${elapsed} detik · Berhasil: ${success} | Gagal: ${failed} | Pair breakout: ${results.length}`,
          "success"
        );
        document.getElementById("progress").textContent = "";
        renderMatrix();

      } catch (err) {
        console.error(err);
        showStatus("Error: " + err.message, "error");
      } finally {
        isScanning = false;
        btn.disabled = false;
      }
    }

    // Load pairs saat buka
    loadPairs().then(pairs => {
      showStatus(`Siap. ${pairs.length} pair IDR aktif berhasil dimuat.`, "success");
    }).catch(err => {
      showStatus("Gagal memuat pairs: " + err.message, "error");
    });
  </script>
</body>
</html>
