<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indodax Donchian Screener - TradingView History</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.9rem;
        }

        .controls-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        select, input, button {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: auto;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-bar {
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.75rem;
            text-align: center;
        }

        .badge-buy { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
        .badge-sell { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
        .badge-neutral { background-color: rgba(234, 179, 8, 0.2); color: var(--accent-yellow); }

        .price-up { color: var(--accent-green); }
        .price-down { color: var(--accent-red); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Indodax Donchian Screener (TradingView API)</h1>
        <p>Analisis otomatis menggunakan endpoint history_v2 Indodax.</p>
    </header>

    <div class="controls-card">
        <div class="form-group">
            <label for="period">Periode Donchian (N)</label>
            <input type="number" id="period" value="20" min="5" max="150">
        </div>
        <div class="form-group">
            <label for="timeframe">Timeframe (tf)</label>
            <select id="timeframe">
                <option value="15">15 Menit</option>
                <option value="60">1 Jam</option>
                <option value="240">4 Jam</option>
                <option value="1D" selected>1 Hari (Daily)</option>
            </select>
        </div>
        <button id="btnScan" onclick="startScanning()">Mulai Analisis</button>
    </div>

    <div class="status-bar">
        <span id="statusText">Status: Siap memindai</span>
        <span id="progressText">0 / 0 Pair</span>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Pair</th>
                    <th>Harga Terakhir</th>
                    <th>Upper Band (High)</th>
                    <th>Middle Band</th>
                    <th>Lower Band (Low)</th>
                    <th>Sinyal</th>
                    <th>Take Profit (TP)</th>
                    <th>Stop Loss (SL)</th>
                </tr>
            </thead>
            <tbody id="resultTable">
                <tr>
                    <td colspan="8" style="text-align: center; color: var(--text-muted);">
                        Klik tombol "Mulai Analisis" untuk memuat data.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const PAIRS_URL = 'https://raw.githubusercontent.com/paulgithubcode/sind/main/pairs.json';
    
    // Konfigurasi Anti-429: Proses serial (1 per 1) dengan jeda aman
    const CONCURRENCY = 1;
    const DELAY_AFTER_REQUEST = 800; // ms
    const RETRY_DELAY = 3000; // ms

    async function fetchWithRetry(url, retries = 3) {
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url);
                if (response.status === 429) {
                    // Jika terkena 429, tunggu lebih lama sebelum mencoba ulang
                    await new Promise(res => setTimeout(res, RETRY_DELAY * (i + 1)));
                    continue;
                }
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                if (i === retries - 1) return null;
                await new Promise(res => setTimeout(res, RETRY_DELAY));
            }
        }
        return null;
    }

    async function fetchPairs() {
        try {
            const response = await fetch(PAIRS_URL);
            if (!response.ok) throw new Error('Gagal mengambil daftar pairs');
            return await response.json();
        } catch (error) {
            console.error('Error fetching pairs:', error);
            alert('Gagal mengambil data pairs.json dari GitHub.');
            return [];
        }
    }

    async function fetchKlineData(pairSymbol, timeframe, period) {
        const symbol = pairSymbol.toUpperCase().replace('_', '');
        const to = Math.floor(Date.now() / 1000);
        const from = to - (120 * 24 * 60 * 60);

        const url = `https://indodax.com/tradingview/history_v2?symbol=${symbol}&tf=${timeframe}&from=${from}&to=${to}`;
        const candles = await fetchWithRetry(url);

        if (!candles || !Array.isArray(candles) || candles.length < period) return null;

        const sliceCandles = candles.slice(candles.length - 1 - period, candles.length - 1);

        let upperBand = -Infinity;
        let lowerBand = Infinity;

        sliceCandles.forEach(c => {
            const h = parseFloat(c.High);
            const l = parseFloat(c.Low);
            if (h > upperBand) upperBand = h;
            if (l < lowerBand) lowerBand = l;
        });

        const middleBand = (upperBand + lowerBand) / 2;
        const currentClose = parseFloat(candles[candles.length - 1].Close);

        return {
            upper: upperBand,
            lower: lowerBand,
            middle: middleBand,
            close: currentClose
        };
    }

    async function mapLimit(array, limit, fn) {
        let index = 0;
        const results = [];
        const running = [];

        async function runNext() {
            if (index === array.length) return;
            const currentIndex = index++;
            const item = array[currentIndex];

            const promise = fn(item, currentIndex).then(result => {
                results[currentIndex] = result;
                running.splice(running.indexOf(promise), 1);
            });

            running.push(promise);

            if (running.length >= limit) {
                await Promise.race(running);
            }
            await runNext();
        }

        await Promise.all(Array(Math.min(limit, array.length)).fill(0).map(() => runNext()));
        return results;
    }

    async function startScanning() {
        const btn = document.getElementById('btnScan');
        const statusText = document.getElementById('statusText');
        const progressText = document.getElementById('progressText');
        const tableBody = document.getElementById('resultTable');
        const period = parseInt(document.getElementById('period').value) || 20;
        const timeframe = document.getElementById('timeframe').value;

        btn.disabled = true;
        statusText.innerText = 'Mengambil daftar pair...';
        tableBody.innerHTML = '';

        const pairsList = await fetchPairs();
        if (!pairsList || pairsList.length === 0) {
            statusText.innerText = 'Gagal memuat list pair.';
            btn.disabled = false;
            return;
        }

        statusText.innerText = 'Memproses analisis data TradingView...';
        let completed = 0;

        await mapLimit(pairsList, CONCURRENCY, async (rawPair) => {
            const symbol = typeof rawPair === 'string' ? rawPair : (rawPair.id || rawPair.symbol);
            if (!symbol) return;

            const cleanSymbol = symbol.toLowerCase().replace('_', '');
            const dc = await fetchKlineData(cleanSymbol, timeframe, period);

            completed++;
            progressText.innerText = `${completed} / ${pairsList.length} Pair`;

            if (dc) {
                let signal = 'NEUTRAL / HOLD';
                let badgeClass = 'badge-neutral';
                let tp = dc.upper;
                let sl = dc.middle;

                if (dc.close >= dc.upper) {
                    signal = 'BELI (Breakout)';
                    badgeClass = 'badge-buy';
                    tp = dc.close * 1.05;
                    sl = dc.middle;
                } else if (dc.close <= dc.lower) {
                    signal = 'JUAL / CUT LOSS';
                    badgeClass = 'badge-sell';
                    tp = dc.middle;
                    sl = dc.lower;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${symbol.toUpperCase()}</strong></td>
                    <td>${new Intl.NumberFormat('id-ID', { maximumFractionDigits: 4 }).format(dc.close)}</td>
                    <td class="price-up">${new Intl.NumberFormat('id-ID', { maximumFractionDigits: 4 }).format(dc.upper)}</td>
                    <td>${new Intl.NumberFormat('id-ID', { maximumFractionDigits: 4 }).format(dc.middle)}</td>
                    <td class="price-down">${new Intl.NumberFormat('id-ID', { maximumFractionDigits: 4 }).format(dc.lower)}</td>
                    <td><span class="badge ${badgeClass}">${signal}</span></td>
                    <td class="price-up">${new Intl.NumberFormat('id-ID', { maximumFractionDigits: 4 }).format(tp)}</td>
                    <td class="price-down">${new Intl.NumberFormat('id-ID', { maximumFractionDigits: 4 }).format(sl)}</td>
                `;
                tableBody.appendChild(tr);
            }

            await new Promise(res => setTimeout(res, DELAY_AFTER_REQUEST));
        });

        statusText.innerText = 'Analisis Selesai!';
        btn.disabled = false;
    }
</script>

</body>
</html>
